<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>過去の記録</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    /* ===== 全体 ===== */

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;

      background: #f7f7fb;
      color: #333;

      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }


    /* ===== カード ===== */

    .card {
      background: white;

      padding: 24px;

      border-radius: 14px;

      margin-bottom: 24px;

      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }


    /* ===== 日付 ===== */

    .date-title {
      font-size: 18px;
      font-weight: bold;

      margin-top: 0;
      margin-bottom: 18px;

      color: #7354c5;
    }


    /* ===== タスク ===== */

    .task-item {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 14px 0;

      border-bottom: 1px solid #eee;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .check-icon {
      color: #22c55e;

      font-size: 18px;
      font-weight: bold;
    }

    .task-text {
      flex: 1;

      font-size: 15px;

      overflow-wrap: anywhere;
    }


    /* ===== 空の状態 ===== */

    .empty-message {
      color: #aaa;

      font-size: 14px;

      text-align: center;

      padding: 30px 0;
    }


    /* ===== 戻るリンク ===== */

    .back-link {
      text-align: center;

      margin-top: 30px;
      margin-bottom: 40px;
    }

    .back-link a {
      display: inline-block;

      padding: 12px 20px;

      background: #eee9ff;
      color: #7354c5;

      text-decoration: none;

      border-radius: 8px;

      font-size: 14px;
      font-weight: bold;
    }

    .back-link a:hover {
      background: #ddd3ff;
    }


    /* ===== スマホ対応 ===== */

    @media (max-width: 600px) {

      .container {
        margin: 15px auto;
      }

      .card {
        padding: 18px;
      }

    }

  </style>

</head>



<body>

  <div class="container">


    <!-- ===== タイトル ===== -->

    <h1>過去の記録</h1>

    <p class="subtitle">
      これまでに完了したタスクを振り返ろう。
    </p>



    <!-- ===== 過去のタスク一覧 ===== -->

    <div id="archiveList"></div>



    <!-- ===== 管理画面に戻る ===== -->

    <div class="back-link">

      <a href="index.html">
        ← タスク管理に戻る
      </a>

    </div>


  </div>

<script>

  // ===================================
  // ① Supabaseの設定
  // ===================================

  // index.htmlと同じURL・Publishable keyを設定する
  const SUPABASE_URL = "https://weftzcfogzqtskhklyft.supabase.co";
  
  const SUPABASE_KEY = "sb_publishable_Ue3wX3hwEheWaZAdidm2Fw_cSy3EAj3";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ===================================
  // ② 日付を「YYYY-MM-DD」に変換
  // ===================================

  function getLocalDateString(date) {
    return new Date(date).toLocaleDateString("sv-SE");
  }


  // ===================================
  // ③ ログイン確認・タスク取得
  // ===================================

  async function loadArchive() {

    const archiveList = document.getElementById("archiveList");

    archiveList.innerHTML = `
      <div class="card">
        <p class="empty-message">読み込み中...</p>
      </div>
    `;

    try {

      // ログイン中のユーザーを確認
      const { data: authData, error: authError } =
        await supabaseClient.auth.getUser();

      if (authError || !authData.user) {
        window.location.replace("./login.html");
        return;
      }

      const currentUser = authData.user;

      // Supabaseから完了済みタスクを取得
      const { data, error } = await supabaseClient
        .from("tasks")
        .select("id,title,status,completed_at")
        .eq("user_id", currentUser.id)
        .eq("status", "completed")
        .not("completed_at", "is", null)
        .order("completed_at", { ascending: false });

      if (error) {
        throw error;
      }

      renderArchive(data);

    } catch (error) {

      console.error("過去の記録の取得に失敗しました:", error);

      archiveList.innerHTML = `
        <div class="card">
          <p class="empty-message">
            過去の記録を取得できませんでした。
          </p>
        </div>
      `;

      alert(
        "過去の記録の取得に失敗しました。\n" + error.message
      );

    }

  }


  // ===================================
  // ④ 日付ごとにタスクを表示
  // ===================================

  function renderArchive(archivedTasks) {

    const archiveList =
      document.getElementById("archiveList");

    archiveList.innerHTML = "";


    // 過去の記録がない場合
    if (archivedTasks.length === 0) {

      archiveList.innerHTML = `
        <div class="card">
          <p class="empty-message">
            過去の記録はまだありません
          </p>
        </div>
      `;

      return;
    }


    // 完了日ごとにグループ化
    const groupedTasks = {};

    archivedTasks.forEach(task => {

      const date = getLocalDateString(task.completed_at);

      if (!groupedTasks[date]) {
        groupedTasks[date] = [];
      }

      groupedTasks[date].push(task);

    });


    // 日付の新しい順に表示
    Object.keys(groupedTasks)
      .sort((a, b) => b.localeCompare(a))
      .forEach(date => {

        // 日付ごとのカード
        const card = document.createElement("div");
        card.className = "card";


        // 日付タイトル
        const dateTitle = document.createElement("h2");
        dateTitle.className = "date-title";

        const formattedDate = new Date(
          date + "T00:00:00"
        ).toLocaleDateString("ja-JP", {
          year: "numeric",
          month: "long",
          day: "numeric"
        });

        dateTitle.textContent = formattedDate;
        card.appendChild(dateTitle);


        // その日に完了したタスクを表示
        groupedTasks[date].forEach(task => {

          const item = document.createElement("div");
          item.className = "task-item";


          // チェックアイコン
          const checkIcon = document.createElement("span");
          checkIcon.className = "check-icon";
          checkIcon.textContent = "✓";


          // タスク名
          const text = document.createElement("div");
          text.className = "task-text";
          text.textContent = task.title;


          item.append(checkIcon, text);
          card.appendChild(item);

        });


        archiveList.appendChild(card);

      });

  }


  // ===================================
  // ⑤ 初期表示
  // ===================================

  loadArchive();

</script>

  

</body>

</html>
