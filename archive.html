<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>過去の記録</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- indexと同じフォント -->
  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
    rel="stylesheet"
  >


  <style>


    /* ===================================
       基本設定
    =================================== */

    * {
      box-sizing: border-box;
    }


    html {
      min-height: 100%;
    }


    body {

      margin: 0;

      padding:
        32px 20px 0;

      /* indexと同じフォント */
      font-family:
        "DotGothic16",
        sans-serif;

      color:
        #203354;

      min-height:
        100vh;


      /* indexと同じ背景 */

      background:
        linear-gradient(
          180deg,
          #bde8ff 0%,
          #dff3ff 22%,
          #f4faff 55%,
          #eef8f0 100%
        );

      background-attachment:
        fixed;

    }



    /* ===================================
       RPG風ヘッダー背景
       indexと同じ
    =================================== */

    .rpg-header-background {

      position:
        absolute;

      top:
        0;

      left:
        0;

      width:
        100%;


      /* 元画像：2156 × 325px */

      aspect-ratio:
        2156 / 325;


      background-image:
        url("images/rpg-header.png");

      background-repeat:
        no-repeat;


      background-size:
        100% auto;

      background-position:
        center top;


      image-rendering:
        pixelated;


      pointer-events:
        none;

      z-index:
        0;

    }



    /* ===================================
       メインコンテナ
    =================================== */

    .container {

      width:
        100%;

      max-width:
        820px;

      margin:
        20px auto 0;

      position:
        relative;

      z-index:
        1;

    }



    /* ===================================
       タイトル
       indexと同じ
    =================================== */

    .header-title {

      background:
        rgba(
          255,
          255,
          255,
          0.85
        );


      padding:
        8px 20px;


      border-radius:
        12px;


      width:
        fit-content;


      margin:
        0 auto 4px;


      text-align:
        center;


      position:
        relative;


      z-index:
        1;


      font-size:
        34px;


      font-weight:
        900;


      letter-spacing:
        1px;


      color:
        #142c59;


      text-shadow:
        0 2px 0
        rgba(
          255,
          255,
          255,
          0.8
        );

    }



    /* ===================================
       サブタイトル
    =================================== */

    .subtitle {

      background:
        rgba(
          255,
          255,
          255,
          0.85
        );


      padding:
        8px 16px;


      border-radius:
        12px;


      width:
        fit-content;


      margin:
        8px auto 70px;


      text-align:
        center;


      position:
        relative;


      z-index:
        1;


      font-size:
        14px;


      font-weight:
        600;


      color:
        #48617c;

    }



    /* ===================================
       共通カード
       indexと同じ
    =================================== */

    .card {

      position:
        relative;


      background:
        rgba(
          255,
          255,
          255,
          0.94
        );


      padding:
        24px;


      border-radius:
        18px;


      margin-bottom:
        20px;


      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.9
        );


      box-shadow:
        0 8px 24px
        rgba(
          57,
          94,
          135,
          0.10
        );


      backdrop-filter:
        blur(5px);

    }



    /* カード下部に少しゲーム感 */

    .card::after {

      content:
        "";


      position:
        absolute;


      left:
        18px;


      right:
        18px;


      bottom:
        -1px;


      height:
        2px;


      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(
            112,
            165,
            198,
            0.16
          ),
          transparent
        );

    }



    /* ===================================
       日付タイトル
    =================================== */

    .date-title {

      width:
        fit-content;


      margin:
        0 0 18px;


      padding:
        7px 12px;


      font-size:
        17px;


      font-weight:
        900;


      color:
        #203354;


      background:
        #ffffff;


      border:
        2px solid
        #324668;


      border-radius:
        8px;


      box-shadow:
        3px 3px 0
        #cce8ed;

    }



    /* ===================================
       タスク
    =================================== */

    .task-item {

      display:
        flex;


      align-items:
        center;


      gap:
        12px;


      padding:
        14px 4px;


      border-bottom:
        1px solid
        #edf0f4;

    }



    .task-item:last-child {

      border-bottom:
        none;

    }



    /* ===================================
       チェックアイコン
    =================================== */

    .check-icon {

      display:
        flex;


      align-items:
        center;


      justify-content:
        center;


      width:
        25px;


      height:
        25px;


      flex-shrink:
        0;


      color:
        #31914a;


      background:
        #dcf7df;


      border:
        1px solid
        #a9dfb1;


      border-radius:
        6px;


      font-size:
        15px;


      font-weight:
        900;

    }



    /* ===================================
       タスク名
    =================================== */

    .task-text {

      flex:
        1;


      min-width:
        0;


      font-size:
        14px;


      font-weight:
        600;


      color:
        #34435d;


      overflow-wrap:
        anywhere;

    }



    /* ===================================
       空状態
    =================================== */

    .empty-message {

      padding:
        25px 0;


      margin:
        0;


      text-align:
        center;


      font-size:
        13px;


      color:
        #a1aab7;

    }



    /* ===================================
       戻るリンク
    =================================== */

    .back-link {

      text-align:
        center;


      margin-top:
        30px;


      margin-bottom:
        65px;

    }



    .back-link a {

      display:
        inline-block;


      padding:
        11px 18px;


      background:
        rgba(
          255,
          255,
          255,
          0.75
        );


      color:
        #5e65a6;


      text-decoration:
        none;


      border-radius:
        10px;


      font-size:
        13px;


      font-weight:
        bold;


      box-shadow:
        0 4px 12px
        rgba(
          50,
          70,
          100,
          0.07
        );


      transition:
        0.2s;

    }



    .back-link a:hover {

      background:
        white;


      transform:
        translateY(-1px);

    }



    /* ===================================
       RPG風フッター
       indexと同じ
    =================================== */

    .rpg-footer-background {

      position:
        relative;


      width:
        calc(
          100% + 40px
        );


      margin-left:
        -20px;


      aspect-ratio:
        2156 / 325;


      background-image:
        url("images/rpg-footer.png");


      background-repeat:
        no-repeat;


      background-size:
        100% auto;


      background-position:
        right bottom;


      image-rendering:
        pixelated;


      pointer-events:
        none;


      z-index:
        0;


      margin-top:
        -50px;


      margin-bottom:
        0;

    }



    /* ===================================
       スマホ
    =================================== */

    @media (
      max-width:
        600px
    ) {


      body {

        padding:
          18px 12px 0;

      }



      .container {

        margin:
          10px auto 0;

      }



      /* ヘッダー */

      .rpg-header-background {

        height:
          180px;


        aspect-ratio:
          auto;


        background-size:
          900px auto;


        background-position:
          right top;

      }



      /* タイトル */

      .header-title {

        font-size:
          27px;


        padding:
          8px 20px;


        margin:
          0 auto 4px;

      }



      /* サブタイトル */

      .subtitle {

        font-size:
          12px;


        margin:
          8px auto 50px;


        padding:
          8px 13px;

      }



      /* カード */

      .card {

        padding:
          18px;


        border-radius:
          15px;


        margin-bottom:
          15px;

      }



      /* 日付 */

      .date-title {

        font-size:
          15px;


        padding:
          6px 10px;


        margin-bottom:
          13px;

      }



      /* タスク */

      .task-item {

        gap:
          10px;


        padding:
          12px 2px;

      }



      .task-text {

        font-size:
          13px;

      }



      .check-icon {

        width:
          23px;


        height:
          23px;


        font-size:
          13px;

      }



      /* 戻る */

      .back-link {

        margin-top:
          25px;


        margin-bottom:
          50px;

      }



      /* フッター */

      .rpg-footer-background {

        width:
          calc(
            100% + 24px
          );


        margin-left:
          -12px;


        height:
          180px;


        aspect-ratio:
          auto;


        background-size:
          900px auto;


        background-position:
          right bottom;


        margin-bottom:
          0;

      }

    }



    /* ===================================
       最下部の余白を消す
    =================================== */

    html,
    body {

      margin-bottom:
        0;


      padding-bottom:
        0;

    }


  </style>

</head>



<body>


  <!-- ===================================
       RPGヘッダー
  =================================== -->

  <div
    class="rpg-header-background"
    aria-hidden="true"
  ></div>



  <!-- ===================================
       メイン
  =================================== -->

  <div class="container">


    <!-- ===== タイトル ===== -->

    <h1 class="header-title">
      過去の記録
    </h1>



    <!-- ===== サブタイトル ===== -->

    <p class="subtitle">
      これまでに完了したタスクを振り返ろう。
    </p>



    <!-- ===== 過去のタスク一覧 ===== -->

    <div id="archiveList"></div>



    <!-- ===== 管理画面に戻る ===== -->

    <div class="back-link">

      <a href="index.html">
        ← タスク管理に戻る
      </a>

    </div>


  </div>



  <!-- ===================================
       RPGフッター
  =================================== -->

  <div
    class="rpg-footer-background"
    aria-hidden="true"
  ></div>



<script>


  // ===================================
  // ① Supabaseの設定
  // ===================================

  const SUPABASE_URL =
    "https://weftzcfogzqtskhklyft.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_Ue3wX3hwEheWaZAdidm2Fw_cSy3EAj3";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );



  // ===================================
  // ② 日付を「YYYY-MM-DD」に変換
  // ===================================

  function getLocalDateString(
    date
  ) {

    return new Date(
      date
    ).toLocaleDateString(
      "sv-SE"
    );

  }



  // ===================================
  // ③ ログイン確認・タスク取得
  // ===================================

  async function loadArchive() {


    const archiveList =
      document.getElementById(
        "archiveList"
      );


    archiveList.innerHTML = `

      <div class="card">

        <p class="empty-message">
          読み込み中...
        </p>

      </div>

    `;


    try {


      // ログイン中のユーザーを確認

      const {

        data:
          authData,

        error:
          authError

      } =

        await supabaseClient
          .auth
          .getUser();



      if (
        authError ||
        !authData.user
      ) {


        window.location.replace(
          "./login.html"
        );


        return;

      }



      const currentUser =
        authData.user;



      // Supabaseから完了済みタスクを取得

      const {

        data,

        error

      } =

        await supabaseClient

          .from(
            "tasks"
          )

          .select(
            "id,title,status,completed_at"
          )

          .eq(
            "user_id",
            currentUser.id
          )

          .eq(
            "status",
            "completed"
          )

          .not(
            "completed_at",
            "is",
            null
          )

          .order(
            "completed_at",
            {
              ascending:
                false
            }
          );



      if (
        error
      ) {

        throw error;

      }



      renderArchive(
        data
      );


    }

    catch (
      error
    ) {


      console.error(
        "過去の記録の取得に失敗しました:",
        error
      );


      archiveList.innerHTML = `

        <div class="card">

          <p class="empty-message">

            過去の記録を取得できませんでした。

          </p>

        </div>

      `;


      alert(

        "過去の記録の取得に失敗しました。\n"

        +

        error.message

      );

    }

  }



  // ===================================
  // ④ 日付ごとにタスクを表示
  // ===================================

  function renderArchive(
    archivedTasks
  ) {


    const archiveList =
      document.getElementById(
        "archiveList"
      );


    archiveList.innerHTML =
      "";



    // 過去の記録がない場合

    if (
      archivedTasks.length ===
      0
    ) {


      archiveList.innerHTML = `

        <div class="card">

          <p class="empty-message">

            過去の記録はまだありません

          </p>

        </div>

      `;


      return;

    }



    // ===================================
    // 完了日ごとにグループ化
    // ===================================

    const groupedTasks =
      {};



    archivedTasks.forEach(

      task => {


        const date =
          getLocalDateString(
            task.completed_at
          );


        if (
          !groupedTasks[
            date
          ]
        ) {


          groupedTasks[
            date
          ] =
            [];

        }


        groupedTasks[
          date
        ].push(
          task
        );

      }

    );



    // ===================================
    // 日付の新しい順
    // ===================================

    Object.keys(
      groupedTasks
    )

      .sort(
        (a, b) =>
          b.localeCompare(
            a
          )
      )

      .forEach(

        date => {


          // =============================
          // 日付カード
          // =============================

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "card";



          // =============================
          // 日付タイトル
          // =============================

          const dateTitle =
            document.createElement(
              "h2"
            );


          dateTitle.className =
            "date-title";



          const formattedDate =

            new Date(
              date +
              "T00:00:00"
            )

            .toLocaleDateString(

              "ja-JP",

              {

                year:
                  "numeric",

                month:
                  "long",

                day:
                  "numeric"

              }

            );



          dateTitle.textContent =
            formattedDate;


          card.appendChild(
            dateTitle
          );



          // =============================
          // その日のタスク
          // =============================

          groupedTasks[
            date
          ]

          .forEach(

            task => {


              const item =
                document.createElement(
                  "div"
                );


              item.className =
                "task-item";



              // チェック

              const checkIcon =
                document.createElement(
                  "span"
                );


              checkIcon.className =
                "check-icon";


              checkIcon.textContent =
                "✓";



              // タスク名

              const text =
                document.createElement(
                  "div"
                );


              text.className =
                "task-text";


              text.textContent =
                task.title;



              item.append(
                checkIcon,
                text
              );


              card.appendChild(
                item
              );

            }

          );



          archiveList.appendChild(
            card
          );

        }

      );

  }



  // ===================================
  // ⑤ 初期表示
  // ===================================

  loadArchive();


</script>



</body>

</html>
