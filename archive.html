<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>過去の記録</title>


  <style>

    /* ===== 全体 ===== */

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;

      background: #f7f7fb;
      color: #333;

      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }


    /* ===== カード ===== */

    .card {
      background: white;

      padding: 24px;

      border-radius: 14px;

      margin-bottom: 24px;

      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }


    /* ===== 日付 ===== */

    .date-title {
      font-size: 18px;
      font-weight: bold;

      margin-top: 0;
      margin-bottom: 18px;

      color: #7354c5;
    }


    /* ===== タスク ===== */

    .task-item {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 14px 0;

      border-bottom: 1px solid #eee;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .check-icon {
      color: #22c55e;

      font-size: 18px;
      font-weight: bold;
    }

    .task-text {
      flex: 1;

      font-size: 15px;

      overflow-wrap: anywhere;
    }


    /* ===== 空の状態 ===== */

    .empty-message {
      color: #aaa;

      font-size: 14px;

      text-align: center;

      padding: 30px 0;
    }


    /* ===== 戻るリンク ===== */

    .back-link {
      text-align: center;

      margin-top: 30px;
      margin-bottom: 40px;
    }

    .back-link a {
      display: inline-block;

      padding: 12px 20px;

      background: #eee9ff;
      color: #7354c5;

      text-decoration: none;

      border-radius: 8px;

      font-size: 14px;
      font-weight: bold;
    }

    .back-link a:hover {
      background: #ddd3ff;
    }


    /* ===== スマホ対応 ===== */

    @media (max-width: 600px) {

      .container {
        margin: 15px auto;
      }

      .card {
        padding: 18px;
      }

    }

  </style>

</head>



<body>

  <div class="container">


    <!-- ===== タイトル ===== -->

    <h1>過去の記録</h1>

    <p class="subtitle">
      これまでに完了したタスクを振り返ろう。
    </p>



    <!-- ===== 過去のタスク一覧 ===== -->

    <div id="archiveList"></div>



    <!-- ===== 管理画面に戻る ===== -->

    <div class="back-link">

      <a href="index.html">
        ← タスク管理に戻る
      </a>

    </div>


  </div>



  <script>

    // ===================================
    // ① データの読み込み
    // ===================================

    let tasks = [];

    try {

      const savedTasks = JSON.parse(
        localStorage.getItem("tasks") || "[]"
      );

      tasks = Array.isArray(savedTasks)
        ? savedTasks
        : [];

    } catch (error) {

      console.error(
        "タスクの読み込みに失敗しました",
        error
      );

    }



    // ===================================
    // ② 今日の日付を取得
    // ===================================

    const today = new Date().toLocaleDateString("sv-SE");



    // ===================================
    // ③ 過去に完了したタスクを取得
    // ===================================

    const archivedTasks = tasks.filter(task => {

      // アーカイブされていなければ除外

      if (!task.archived) {
        return false;
      }


      // 完了日時がなければ除外

      if (!task.archivedAt) {
        return false;
      }


      // 完了日を取得

      const archivedDate = new Date(
        task.archivedAt
      ).toLocaleDateString("sv-SE");


      // 今日より前の日付なら取得

      return archivedDate < today;

    });



    // ===================================
    // ④ 完了日の新しい順に並び替え
    // ===================================

    archivedTasks.sort((a, b) => {

      return new Date(b.archivedAt)
        - new Date(a.archivedAt);

    });



    // ===================================
    // ⑤ 日付ごとにグループ化
    // ===================================

    const groupedTasks = {};


    archivedTasks.forEach(task => {

      const date = new Date(
        task.archivedAt
      ).toLocaleDateString("sv-SE");


      // 日付のグループがなければ作成

      if (!groupedTasks[date]) {

        groupedTasks[date] = [];

      }


      // 該当する日付のグループに追加

      groupedTasks[date].push(task);

    });



    // ===================================
    // ⑥ 過去のタスクを表示
    // ===================================

    function renderArchive() {

      const archiveList = document.getElementById(
        "archiveList"
      );


      archiveList.innerHTML = "";


      // 過去の記録がない場合

      if (archivedTasks.length === 0) {

        archiveList.innerHTML = `
          <div class="card">

            <p class="empty-message">
              過去の記録はまだありません
            </p>

          </div>
        `;

        return;

      }



      // 日付ごとに表示

      Object.keys(groupedTasks).forEach(date => {


        // ===== 日付ごとのカード =====

        const card = document.createElement("div");

        card.className = "card";



        // ===== 日付タイトル =====

        const dateTitle = document.createElement("h2");

        dateTitle.className = "date-title";


        const formattedDate = new Date(
          date + "T00:00:00"
        ).toLocaleDateString("ja-JP", {

          year: "numeric",
          month: "long",
          day: "numeric"

        });


        dateTitle.textContent = formattedDate;


        card.appendChild(dateTitle);



        // ===== タスク一覧 =====

        groupedTasks[date].forEach(task => {


          const item = document.createElement("div");

          item.className = "task-item";



          // チェックアイコン

          const checkIcon = document.createElement("span");

          checkIcon.className = "check-icon";

          checkIcon.textContent = "✓";



          // タスクの内容

          const text = document.createElement("div");

          text.className = "task-text";

          text.textContent = task.text;



          // タスクを追加

          item.append(
            checkIcon,
            text
          );


          card.appendChild(item);

        });



        // ===== 画面に追加 =====

        archiveList.appendChild(card);

      });

    }



    // ===================================
    // ⑦ 初期表示
    // ===================================

    renderArchive();


  </script>

</body>

</html>
