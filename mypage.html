<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>マイページ | タスク管理アプリ</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    /* ===================================
       全体
    =================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      background: #f7f7fb;
      color: #333;

      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }


    /* ===================================
       RPG風ヘッダー
    =================================== */

    .rpg-header {
      position: relative;

      width: 100%;
      height: 240px;

      background-image:
        url("images/rpg-header.png");

      background-repeat: no-repeat;

      background-position:
        center top;

      background-size:
        cover;

      display: flex;

      justify-content:
        center;

      align-items:
        flex-start;

      padding-top:
        35px;
    }


    /* ===================================
       ページタイトル
    =================================== */

    .page-title {

      margin: 0;

      padding:
        10px 24px;

      background:
        rgba(255, 255, 255, 0.88);

      border-radius:
        14px;

      font-size:
        28px;

      font-weight:
        700;

      text-align:
        center;

      line-height:
        1.4;

      box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.08);

      backdrop-filter:
        blur(2px);

      -webkit-backdrop-filter:
        blur(2px);
    }


    /* ===================================
       メインコンテンツ
    =================================== */

    main {
      flex: 1;

      width: 100%;

      padding:
        30px 20px 50px;
    }


    .container {

      width: 100%;

      max-width:
        600px;

      margin:
        0 auto;
    }


    /* ===================================
       マイページカード
    =================================== */

    .card {

      width: 100%;

      background:
        rgba(255, 255, 255, 0.95);

      padding:
        30px;

      border-radius:
        16px;

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.07);

      text-align:
        center;
    }


    /* ===================================
       ユーザー名
    =================================== */

    .username {

      font-size:
        16px;

      color:
        #777;

      margin-bottom:
        22px;

      font-weight:
        600;
    }


    /* ===================================
       キャラクター画像
    =================================== */

    .character-icon {

      width:
        180px;

      height:
        180px;

      object-fit:
        contain;

      display:
        block;

      margin:
        0 auto 12px;
    }


    /* ===================================
       キャラクター名
    =================================== */

    .character-name {

      font-size:
        20px;

      font-weight:
        bold;

      margin-bottom:
        10px;
    }


    /* ===================================
       レベル
    =================================== */

    .character-level {

      font-size:
        28px;

      font-weight:
        bold;

      color:
        #7354c5;
    }


    /* ===================================
       EXP
    =================================== */

    .exp-area {

      margin-top:
        30px;
    }


    .exp-info {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      font-size:
        14px;

      margin-bottom:
        8px;

      font-weight:
        600;
    }


    .exp-bar {

      width:
        100%;

      height:
        14px;

      background:
        #eee9ff;

      border-radius:
        10px;

      overflow:
        hidden;
    }


    .exp-fill {

      width:
        0%;

      height:
        100%;

      background:
        #a78bfa;

      border-radius:
        10px;

      transition:
        width 0.5s ease;
    }


    /* ===================================
       累計経験値
    =================================== */

    .total-exp {

      font-size:
        14px;

      color:
        #888;

      margin-top:
        18px;

      margin-bottom:
        0;
    }


    /* ===================================
       戻るボタン
    =================================== */

    .back-area {

      text-align:
        center;

      margin-top:
        24px;
    }


    .back-link {

      display:
        inline-block;

      padding:
        12px 22px;

      background:
        #eee9ff;

      color:
        #7354c5;

      text-decoration:
        none;

      border-radius:
        10px;

      font-size:
        14px;

      font-weight:
        bold;

      transition:
        0.2s;
    }


    .back-link:hover {

      background:
        #ddd3ff;

      transform:
        translateY(-1px);
    }


    /* ===================================
       RPG風フッター
    =================================== */

    .rpg-footer {

      width:
        100%;

      height:
        220px;

      background-image:
        url("images/rpg-footer.png");

      background-repeat:
        no-repeat;

      background-position:
        center bottom;

      background-size:
        cover;

      margin-top:
        auto;
    }


    /* ===================================
       スマホ
    =================================== */

    @media
    (max-width: 600px) {

      .rpg-header {

        height:
          180px;

        padding-top:
          25px;

        background-position:
          center top;
      }


      .page-title {

        font-size:
          23px;

        padding:
          8px 18px;

        border-radius:
          12px;
      }


      main {

        padding:
          24px 16px 35px;
      }


      .container {

        max-width:
          100%;
      }


      .card {

        padding:
          24px 18px;
      }


      .character-icon {

        width:
          150px;

        height:
          150px;
      }


      .character-name {

        font-size:
          19px;
      }


      .character-level {

        font-size:
          25px;
      }


      .rpg-footer {

        height:
          160px;

        background-position:
          center bottom;
      }

    }


  </style>

</head>


<body>


  <!-- ===================================
       RPGヘッダー
  =================================== -->

  <header class="rpg-header">

    <h1 class="page-title">
      マイページ
    </h1>

  </header>



  <!-- ===================================
       メイン
  =================================== -->

  <main>

    <div class="container">


      <div class="card">


        <!-- ユーザー名 -->

        <div
          id="username"
          class="username"
        >
          読み込み中...
        </div>



        <!-- キャラクター画像 -->

        <img
          id="characterIcon"
          class="character-icon"
          src="images/mijuku-slime.png"
          alt="未熟なスライム"
        >



        <!-- キャラクター名 -->

        <div
          id="characterName"
          class="character-name"
        >
          未熟なスライム
        </div>



        <!-- レベル -->

        <div
          id="characterLevel"
          class="character-level"
        >
          Lv.1
        </div>



        <!-- EXP -->

        <div class="exp-area">


          <div class="exp-info">

            <span>
              EXP
            </span>

            <span id="expText">
              0 / 20
            </span>

          </div>


          <div class="exp-bar">

            <div
              id="expFill"
              class="exp-fill"
            ></div>

          </div>


        </div>



        <!-- 累計経験値 -->

        <p
          id="totalExp"
          class="total-exp"
        >
          累計経験値：0 EXP
        </p>


      </div>



      <!-- 戻る -->

      <div class="back-area">

        <a
          href="index.html"
          class="back-link"
        >
          ← タスク管理に戻る
        </a>

      </div>


    </div>

  </main>



  <!-- ===================================
       RPGフッター
  =================================== -->

  <footer class="rpg-footer"></footer>



  <script>


    // =====================================
    // ① Supabaseの設定
    // =====================================

    const SUPABASE_URL =
      "https://weftzcfogzqtskhklyft.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_Ue3wX3hwEheWaZAdidm2Fw_cSy3EAj3";


    const db =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    // =====================================
    // ② EXPのルール
    // =====================================

    const TASK_EXP = 10;

    const DAILY_BONUS_EXP = 10;

    const DAILY_GOAL = 5;



    // =====================================
    // ③ レベルアップに必要な累計EXP
    // =====================================

    const levelMilestones = [

      [1, 0],

      [2, 20],

      [5, 420],

      [15, 1800],

      [30, 5400],

      [50, 10800]

    ];



    const levelTable =
      Array.from(
        {
          length: 50
        },

        (_, index) => {


          const level =
            index + 1;


          const upperIndex =
            levelMilestones.findIndex(
              ([milestone]) =>
                milestone >= level
            );


          const [
            endLevel,
            endExp
          ] =
            levelMilestones[
              upperIndex
            ];


          if (
            level === endLevel
          ) {

            return endExp;

          }


          const [
            startLevel,
            startExp
          ] =
            levelMilestones[
              upperIndex - 1
            ];


          const ratio =
            (
              level -
              startLevel
            )
            /
            (
              endLevel -
              startLevel
            );


          return Math.round(
            (
              startExp +
              (
                endExp -
                startExp
              ) *
              ratio
            )
            /
            10
          ) * 10;

        }
      );



    // =====================================
    // ④ 現在のレベルを計算
    // =====================================

    function calculateLevel(
      totalExp
    ) {


      let level = 1;


      for (
        let i = 0;
        i < levelTable.length;
        i++
      ) {


        if (
          totalExp >=
          levelTable[i]
        ) {

          level =
            i + 1;

        }

        else {

          break;

        }

      }


      return level;

    }



    // =====================================
    // ⑤ レベルに応じてキャラクター変更
    // =====================================

    function getCharacter(
      level
    ) {


      // Lv.50

      if (
        level >= 50
      ) {

        return {

          name:
            "ゴッドスライム",

          image:
            "images/god-slime.png"

        };

      }



      // Lv.40〜49

      if (
        level >= 40
      ) {

        return {

          name:
            "キングスライム",

          image:
            "images/king-slime.png"

        };

      }



      // Lv.30〜39

      if (
        level >= 30
      ) {

        return {

          name:
            "スライム伯爵",

          image:
            "images/slime-hakushaku.png"

        };

      }



      // Lv.15〜29

      if (
        level >= 15
      ) {

        return {

          name:
            "大人スライム",

          image:
            "images/otona-slime.png"

        };

      }



      // Lv.5〜14

      if (
        level >= 5
      ) {

        return {

          name:
            "ほどほどのスライム",

          image:
            "images/hodohodo-slime.png"

        };

      }



      // Lv.1〜4

      return {

        name:
          "未熟なスライム",

        image:
          "images/mijuku-slime.png"

      };

    }



    // =====================================
    // ⑥ 完了済みタスクからEXPを計算
    // =====================================

    function calculateTotalExp(
      tasks
    ) {


      const completed =
        tasks.filter(

          task =>

            task.status ===
              "completed"

            &&

            task.completed_at

        );



      // 日ごとの完了数

      const counts = {};



      for (
        const task
        of completed
      ) {


        const day =
          new Date(
            task.completed_at
          )
          .toLocaleDateString(
            "sv-SE"
          );


        counts[day] =
          (
            counts[day]
            ||
            0
          )
          +
          1;

      }



      // 1日5個以上達成した日

      const bonusDays =
        Object.values(
          counts
        )
        .filter(

          count =>
            count >=
            DAILY_GOAL

        )
        .length;



      // EXP

      return (

        completed.length *
        TASK_EXP

        +

        bonusDays *
        DAILY_BONUS_EXP

      );

    }



    // =====================================
    // ⑦ キャラクター表示
    // =====================================

    function renderCharacter(
      totalExp
    ) {


      const level =
        calculateLevel(
          totalExp
        );


      const character =
        getCharacter(
          level
        );



      // キャラクター画像

      const characterIcon =
        document.getElementById(
          "characterIcon"
        );


      characterIcon.src =
        character.image;


      characterIcon.alt =
        character.name;



      // キャラクター名

      document
        .getElementById(
          "characterName"
        )
        .textContent =
          character.name;



      // レベル

      document
        .getElementById(
          "characterLevel"
        )
        .textContent =
          "Lv." +
          level;



      // EXPゲージ

      if (
        level === 50
      ) {


        document
          .getElementById(
            "expText"
          )
          .textContent =
            "MAX LEVEL";


        document
          .getElementById(
            "expFill"
          )
          .style.width =
            "100%";

      }

      else {


        const currentLevelExp =
          levelTable[
            level - 1
          ];


        const nextLevelExp =
          levelTable[
            level
          ];


        const currentExp =
          totalExp -
          currentLevelExp;


        const requiredExp =
          nextLevelExp -
          currentLevelExp;


        const expPercent =
          (
            currentExp /
            requiredExp
          )
          *
          100;



        document
          .getElementById(
            "expText"
          )
          .textContent =
            currentExp +
            " / " +
            requiredExp;



        document
          .getElementById(
            "expFill"
          )
          .style.width =
            expPercent +
            "%";

      }



      // 累計EXP

      document
        .getElementById(
          "totalExp"
        )
        .textContent =

          "累計経験値：" +
          totalExp +
          " EXP";

    }



    // =====================================
    // ⑧ マイページ読み込み
    // =====================================

    async function loadMyPage() {


      // ログインユーザー

      const {

        data:
          authData,

        error:
          authError

      } =
        await db.auth.getUser();



      if (
        authError ||
        !authData.user
      ) {

        window.location.replace(
          "./login.html"
        );

        return;

      }



      const user =
        authData.user;



      // ===================================
      // ユーザー名
      // ===================================

      const {

        data:
          profile,

        error:
          profileError

      } =
        await db

          .from(
            "profiles"
          )

          .select(
            "username"
          )

          .eq(
            "id",
            user.id
          )

          .single();



      if (
        profileError
      ) {


        console.error(
          "プロフィール取得エラー:",
          profileError
        );


        document
          .getElementById(
            "username"
          )
          .textContent =
            "ユーザー名を取得できませんでした";

      }

      else {


        document
          .getElementById(
            "username"
          )
          .textContent =
            profile.username;

      }



      // ===================================
      // 完了済みタスク
      // ===================================

      const {

        data:
          tasks,

        error:
          tasksError

      } =
        await db

          .from(
            "tasks"
          )

          .select(
            "status, completed_at"
          )

          .eq(
            "user_id",
            user.id
          )

          .eq(
            "status",
            "completed"
          );



      if (
        tasksError
      ) {


        console.error(
          "タスク取得エラー:",
          tasksError
        );


        alert(
          "タスクの取得に失敗しました：" +
          tasksError.message
        );


        return;

      }



      // EXP計算

      const totalExp =
        calculateTotalExp(
          tasks
        );



      // キャラクター表示

      renderCharacter(
        totalExp
      );

    }



    // =====================================
    // ⑨ 初期表示
    // =====================================

    loadMyPage();


  </script>


</body>

</html>
