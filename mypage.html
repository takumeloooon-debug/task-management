<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>マイページ | タスク管理アプリ</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #f7f7fb;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      text-align: center;
    }

    .username {
      font-size: 16px;
      color: #777;
      margin-bottom: 24px;
    }

    /* キャラクター画像 */
    .character-icon {
      width: 180px;
      height: 180px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    }

    .character-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .character-level {
      font-size: 26px;
      font-weight: bold;
      color: #7354c5;
    }

    .exp-area {
      margin-top: 30px;
    }

    .exp-info {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .exp-bar {
      width: 100%;
      height: 14px;
      background: #eee9ff;
      border-radius: 10px;
      overflow: hidden;
    }

    .exp-fill {
      width: 0%;
      height: 100%;
      background: #a78bfa;
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .total-exp {
      font-size: 14px;
      color: #888;
      margin-top: 18px;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 20px;
      background: #eee9ff;
      color: #7354c5;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .back-link:hover {
      background: #ddd3ff;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>マイページ</h1>

    <div class="card">

      <!-- ユーザー名 -->
      <div id="username" class="username">
        読み込み中...
      </div>


      <!-- キャラクター画像 -->
      <img
        id="characterIcon"
        class="character-icon"
        src="images/mijuku-slime.png"
        alt="未熟なスライム"
      >


      <!-- キャラクター名 -->
      <div id="characterName" class="character-name">
        未熟なスライム
      </div>


      <!-- レベル -->
      <div id="characterLevel" class="character-level">
        Lv.1
      </div>


      <!-- EXP -->
      <div class="exp-area">

        <div class="exp-info">

          <span>EXP</span>

          <span id="expText">
            0 / 20
          </span>

        </div>

        <div class="exp-bar">

          <div
            id="expFill"
            class="exp-fill"
          ></div>

        </div>

      </div>


      <!-- 累計経験値 -->
      <p id="totalExp" class="total-exp">
        累計経験値：0 EXP
      </p>

    </div>


    <a href="index.html" class="back-link">
      ← タスク管理に戻る
    </a>

  </div>


  <script>

    // =====================================
    // ① Supabaseの設定
    // =====================================

    const SUPABASE_URL =
      "https://weftzcfogzqtskhklyft.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ue3wX3hwEheWaZAdidm2Fw_cSy3EAj3";

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // =====================================
    // ② EXPのルール
    // =====================================

    const TASK_EXP = 10;

    const DAILY_BONUS_EXP = 10;

    const DAILY_GOAL = 5;


    // =====================================
    // ③ レベルアップに必要な累計EXP
    // index.htmlと同じ設定
    // =====================================

    const levelMilestones = [
      [1, 0],
      [2, 20],
      [5, 420],
      [15, 1800],
      [30, 5400],
      [50, 10800]
    ];


    const levelTable = Array.from(
      { length: 50 },
      (_, index) => {

        const level = index + 1;

        const upperIndex =
          levelMilestones.findIndex(
            ([milestone]) => milestone >= level
          );

        const [endLevel, endExp] =
          levelMilestones[upperIndex];

        if (level === endLevel) {
          return endExp;
        }

        const [startLevel, startExp] =
          levelMilestones[upperIndex - 1];

        const ratio =
          (level - startLevel) /
          (endLevel - startLevel);

        return Math.round(
          (
            startExp +
            (endExp - startExp) * ratio
          ) / 10
        ) * 10;

      }
    );


    // =====================================
    // ④ 現在のレベルを計算
    // =====================================

    function calculateLevel(totalExp) {

      let level = 1;

      for (
        let i = 0;
        i < levelTable.length;
        i++
      ) {

        if (totalExp >= levelTable[i]) {

          level = i + 1;

        } else {

          break;

        }

      }

      return level;

    }


    // =====================================
    // ⑤ レベルに応じてキャラクターを変更
    // =====================================

    function getCharacter(level) {


      // Lv.50
      if (level >= 50) {

        return {

          name:
            "ゴッドスライム",

          image:
            "images/god-slime.png"

        };

      }


      // Lv.40〜49
      if (level >= 40) {

        return {

          name:
            "キングスライム",

          image:
            "images/king-slime.png"

        };

      }


      // Lv.30〜39
      if (level >= 30) {

        return {

          name:
            "スライム伯爵",

          image:
            "images/slime-hakushaku.png"

        };

      }


      // Lv.15〜29
      if (level >= 15) {

        return {

          name:
            "大人スライム",

          image:
            "images/otona-slime.png"

        };

      }


      // Lv.5〜14
      if (level >= 5) {

        return {

          name:
            "ほどほどのスライム",

          image:
            "images/hodohodo-slime.png"

        };

      }


      // Lv.1〜4
      return {

        name:
          "未熟なスライム",

        image:
          "images/mijuku-slime.png"

      };

    }


    // =====================================
    // ⑥ 完了済みタスクからEXPを計算
    // =====================================

    function calculateTotalExp(tasks) {

      const completed =
        tasks.filter(
          task =>
            task.status === "completed" &&
            task.completed_at
        );


      // 日ごとの完了タスク数

      const counts = {};


      for (const task of completed) {

        const day =
          new Date(
            task.completed_at
          ).toLocaleDateString(
            "sv-SE"
          );

        counts[day] =
          (counts[day] || 0) + 1;

      }


      // 1日5個以上達成した日

      const bonusDays =
        Object.values(counts)
          .filter(
            count =>
              count >= DAILY_GOAL
          )
          .length;


      // EXP計算

      return (

        completed.length *
        TASK_EXP

        +

        bonusDays *
        DAILY_BONUS_EXP

      );

    }


    // =====================================
    // ⑦ キャラクターを画面に表示
    // =====================================

    function renderCharacter(totalExp) {


      // 現在レベル

      const level =
        calculateLevel(totalExp);


      // 現在のキャラクター

      const character =
        getCharacter(level);


      // ===================================
      // キャラクター画像
      // ===================================

      const characterIcon =
        document.getElementById(
          "characterIcon"
        );

      characterIcon.src =
        character.image;

      characterIcon.alt =
        character.name;


      // ===================================
      // キャラクター名
      // ===================================

      document.getElementById(
        "characterName"
      ).textContent =
        character.name;


      // ===================================
      // レベル
      // ===================================

      document.getElementById(
        "characterLevel"
      ).textContent =
        "Lv." + level;


      // ===================================
      // EXPゲージ
      // ===================================

      if (level === 50) {

        document.getElementById(
          "expText"
        ).textContent =
          "MAX LEVEL";


        document.getElementById(
          "expFill"
        ).style.width =
          "100%";

      } else {


        // 現在レベルになるために必要だったEXP

        const currentLevelExp =
          levelTable[level - 1];


        // 次レベルに必要な累計EXP

        const nextLevelExp =
          levelTable[level];


        // 現在レベル内で獲得したEXP

        const currentExp =
          totalExp -
          currentLevelExp;


        // 次レベルまでに必要なEXP

        const requiredExp =
          nextLevelExp -
          currentLevelExp;


        // EXPバーの割合

        const expPercent =
          (
            currentExp /
            requiredExp
          ) * 100;


        // EXPテキスト

        document.getElementById(
          "expText"
        ).textContent =
          currentExp +
          " / " +
          requiredExp;


        // EXPバー

        document.getElementById(
          "expFill"
        ).style.width =
          expPercent + "%";

      }


      // ===================================
      // 累計EXP
      // ===================================

      document.getElementById(
        "totalExp"
      ).textContent =
        "累計経験値：" +
        totalExp +
        " EXP";

    }


    // =====================================
    // ⑧ マイページのデータを読み込む
    // =====================================

    async function loadMyPage() {


      // ===================================
      // ログイン中のユーザーを取得
      // ===================================

      const {
        data: authData,
        error: authError
      } =
        await db.auth.getUser();


      // ログインしていなければ
      // login.htmlへ戻す

      if (
        authError ||
        !authData.user
      ) {

        window.location.replace(
          "./login.html"
        );

        return;

      }


      const user =
        authData.user;


      // ===================================
      // ユーザー名を取得
      // ===================================

      const {
        data: profile,
        error: profileError
      } =
        await db
          .from("profiles")
          .select("username")
          .eq("id", user.id)
          .single();


      if (profileError) {

        console.error(
          "プロフィール取得エラー:",
          profileError
        );


        document.getElementById(
          "username"
        ).textContent =
          "ユーザー名を取得できませんでした";

      } else {

        document.getElementById(
          "username"
        ).textContent =
          profile.username;

      }


      // ===================================
      // 本人の完了済みタスクを取得
      // ===================================

      const {
        data: tasks,
        error: tasksError
      } =
        await db
          .from("tasks")
          .select(
            "status, completed_at"
          )
          .eq(
            "user_id",
            user.id
          )
          .eq(
            "status",
            "completed"
          );


      if (tasksError) {

        console.error(
          "タスク取得エラー:",
          tasksError
        );


        alert(
          "タスクの取得に失敗しました：" +
          tasksError.message
        );

        return;

      }


      // ===================================
      // EXPを計算
      // ===================================

      const totalExp =
        calculateTotalExp(tasks);


      // ===================================
      // キャラクター表示
      // ===================================

      renderCharacter(totalExp);

    }


    // =====================================
    // ⑨ 初期表示
    // =====================================

    loadMyPage();

  </script>

</body>

</html>
