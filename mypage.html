<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>マイページ | タスク管理アプリ</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #f7f7fb;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      text-align: center;
    }

    .username {
      font-size: 16px;
      color: #777;
      margin-bottom: 24px;
    }

    .character-icon {
      font-size: 100px;
      margin-bottom: 12px;
    }

    .character-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .character-level {
      font-size: 26px;
      font-weight: bold;
      color: #7354c5;
    }

    .exp-area {
      margin-top: 30px;
    }

    .exp-info {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .exp-bar {
      width: 100%;
      height: 14px;
      background: #eee9ff;
      border-radius: 10px;
      overflow: hidden;
    }

    .exp-fill {
      width: 0%;
      height: 100%;
      background: #a78bfa;
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .total-exp {
      font-size: 14px;
      color: #888;
      margin-top: 18px;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 20px;
      background: #eee9ff;
      color: #7354c5;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .back-link:hover {
      background: #ddd3ff;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>マイページ</h1>

    <div class="card">

      <!-- ユーザー名 -->
      <div id="username" class="username">
        読み込み中...
      </div>

      <!-- キャラクター -->
      <div id="characterIcon" class="character-icon">
        💧
      </div>

      <div id="characterName" class="character-name">
        スライム
      </div>

      <div id="characterLevel" class="character-level">
        Lv.1
      </div>

      <!-- EXP -->
      <div class="exp-area">

        <div class="exp-info">

          <span>EXP</span>

          <span id="expText">
            0 / 20
          </span>

        </div>

        <div class="exp-bar">

          <div
            id="expFill"
            class="exp-fill"
          ></div>

        </div>

      </div>

      <!-- 累計経験値 -->
      <p id="totalExp" class="total-exp">
        累計経験値：0 EXP
      </p>

    </div>

    <a href="index.html" class="back-link">
      ← タスク管理に戻る
    </a>

  </div>


  <script>

    // =====================================
    // ① Supabaseの設定
    // =====================================

    const SUPABASE_URL = "ここにSupabaseのURL";

    const SUPABASE_KEY = "ここにPublishable Key";

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // =====================================
    // ② EXPのルール
    // =====================================

    const TASK_EXP = 10;

    const DAILY_BONUS_EXP = 10;

    const DAILY_GOAL = 5;


    // =====================================
    // ③ レベルアップに必要な累計EXP
    // index.htmlと同じ設定
    // =====================================

    const levelMilestones = [
      [1, 0],
      [2, 20],
      [5, 420],
      [15, 1800],
      [30, 5400],
      [50, 10800]
    ];

    const levelTable = Array.from(
      { length: 50 },
      (_, index) => {

        const level = index + 1;

        const upperIndex = levelMilestones.findIndex(
          ([milestone]) => milestone >= level
        );

        const [endLevel, endExp] =
          levelMilestones[upperIndex];

        if (level === endLevel) {
          return endExp;
        }

        const [startLevel, startExp] =
          levelMilestones[upperIndex - 1];

        const ratio =
          (level - startLevel) /
          (endLevel - startLevel);

        return Math.round(
          (startExp + (endExp - startExp) * ratio) / 10
        ) * 10;

      }
    );


    // =====================================
    // ④ 現在のレベルを計算
    // =====================================

    function calculateLevel(totalExp) {

      let level = 1;

      for (let i = 0; i < levelTable.length; i++) {

        if (totalExp >= levelTable[i]) {
          level = i + 1;
        } else {
          break;
        }

      }

      return level;

    }


    // =====================================
    // ⑤ レベルに応じてキャラクターを変更
    // index.htmlと同じ進化条件
    // =====================================

    function getCharacter(level) {

      if (level >= 50) {
        return {
          name: "伝説のドラゴン",
          icon: "🐲"
        };
      }

      if (level >= 43) {
        return {
          name: "ドラゴン",
          icon: "🐉"
        };
      }

      if (level >= 30) {
        return {
          name: "ドラゴンの幼体",
          icon: "🥚"
        };
      }

      if (level >= 15) {
        return {
          name: "スライムキング",
          icon: "👑"
        };
      }

      if (level >= 5) {
        return {
          name: "成長したスライム",
          icon: "💙"
        };
      }

      return {
        name: "スライム",
        icon: "💧"
      };

    }


    // =====================================
    // ⑥ 完了済みタスクからEXPを計算
    // =====================================

    function calculateTotalExp(tasks) {

      const completed = tasks.filter(
        task =>
          task.status === "completed" &&
          task.completed_at
      );

      const counts = {};

      for (const task of completed) {

        const day = new Date(
          task.completed_at
        ).toLocaleDateString("sv-SE");

        counts[day] = (counts[day] || 0) + 1;

      }

      const bonusDays = Object.values(counts)
        .filter(count => count >= DAILY_GOAL)
        .length;

      return (
        completed.length * TASK_EXP +
        bonusDays * DAILY_BONUS_EXP
      );

    }


    // =====================================
    // ⑦ キャラクターを画面に表示
    // =====================================

    function renderCharacter(totalExp) {

      const level = calculateLevel(totalExp);

      const character = getCharacter(level);

      document.getElementById(
        "characterIcon"
      ).textContent = character.icon;

      document.getElementById(
        "characterName"
      ).textContent = character.name;

      document.getElementById(
        "characterLevel"
      ).textContent = "Lv." + level;


      // EXPゲージ

      if (level === 50) {

        document.getElementById(
          "expText"
        ).textContent = "MAX LEVEL";

        document.getElementById(
          "expFill"
        ).style.width = "100%";

      } else {

        const currentLevelExp =
          levelTable[level - 1];

        const nextLevelExp =
          levelTable[level];

        const currentExp =
          totalExp - currentLevelExp;

        const requiredExp =
          nextLevelExp - currentLevelExp;

        const expPercent =
          (currentExp / requiredExp) * 100;

        document.getElementById(
          "expText"
        ).textContent =
          currentExp + " / " + requiredExp;

        document.getElementById(
          "expFill"
        ).style.width = expPercent + "%";

      }


      document.getElementById(
        "totalExp"
      ).textContent =
        "累計経験値：" + totalExp + " EXP";

    }


    // =====================================
    // ⑧ マイページのデータを読み込む
    // =====================================

    async function loadMyPage() {

      // ログイン中のユーザーを取得

      const {
        data: authData,
        error: authError
      } = await db.auth.getUser();

      if (authError || !authData.user) {

        window.location.replace("./login.html");

        return;

      }

      const user = authData.user;


      // ユーザー名を取得

      const {
        data: profile,
        error: profileError
      } = await db
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .single();

      if (profileError) {

        console.error(
          "プロフィール取得エラー:",
          profileError
        );

        document.getElementById(
          "username"
        ).textContent = "ユーザー名を取得できませんでした";

      } else {

        document.getElementById(
          "username"
        ).textContent = profile.username;

      }


      // 本人のタスクを取得

      const {
        data: tasks,
        error: tasksError
      } = await db
        .from("tasks")
        .select("status, completed_at")
        .eq("user_id", user.id)
        .eq("status", "completed");

      if (tasksError) {

        console.error(
          "タスク取得エラー:",
          tasksError
        );

        alert(
          "タスクの取得に失敗しました：" +
          tasksError.message
        );

        return;

      }


      // EXPを計算して画面に表示

      const totalExp = calculateTotalExp(tasks);

      renderCharacter(totalExp);

    }


    // =====================================
    // ⑨ 初期表示
    // =====================================

    loadMyPage();

  </script>

</body>
</html>
