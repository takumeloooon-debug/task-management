<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>マイページ | タスク管理アプリ</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- indexと同じフォント -->
  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
    rel="stylesheet"
  >


  <style>


    /* ===================================
       基本設定
    =================================== */

    * {
      box-sizing: border-box;
    }


    html {
      min-height: 100%;
    }


    body {

      margin: 0;

      padding:
        32px 20px 0;

      /* indexと同じフォント */
      font-family:
        "DotGothic16",
        sans-serif;

      color:
        #203354;

      min-height:
        100vh;


      /* indexと同じ背景 */

      background:
        linear-gradient(
          180deg,
          #bde8ff 0%,
          #dff3ff 22%,
          #f4faff 55%,
          #eef8f0 100%
        );

      background-attachment:
        fixed;

    }



    /* ===================================
       RPG風ヘッダー背景
       indexと同じ設定
    =================================== */

    .rpg-header-background {

      position:
        absolute;

      top:
        0;

      left:
        0;

      width:
        100%;


      /* 元画像 2156 × 325 */

      aspect-ratio:
        2156 / 325;


      background-image:
        url("images/rpg-header.png");

      background-repeat:
        no-repeat;


      /* indexと同じ */

      background-size:
        100% auto;

      background-position:
        center top;


      image-rendering:
        pixelated;


      pointer-events:
        none;

      z-index:
        0;

    }



    /* ===================================
       メインコンテナ
       indexと同じ横幅
    =================================== */

    .container {

      width:
        100%;

      max-width:
        820px;

      margin:
        20px auto 0;

      position:
        relative;

      z-index:
        1;

    }



    /* ===================================
       タイトル
       indexと同じ白枠
    =================================== */

    .header-title {

      background:
        rgba(
          255,
          255,
          255,
          0.85
        );


      padding:
        8px 20px;


      border-radius:
        12px;


      width:
        fit-content;


      margin:
        0 auto 4px;


      text-align:
        center;


      position:
        relative;


      z-index:
        1;


      font-size:
        34px;


      font-weight:
        900;


      letter-spacing:
        1px;


      color:
        #142c59;


      text-shadow:
        0 2px 0
        rgba(
          255,
          255,
          255,
          0.8
        );

    }



    /* ===================================
       タイトル下の余白
    =================================== */

    .header-space {

      height:
        85px;

    }



    /* ===================================
       共通カード
       indexと同じ
    =================================== */

    .card {

      position:
        relative;


      background:
        rgba(
          255,
          255,
          255,
          0.94
        );


      padding:
        24px;


      border-radius:
        18px;


      margin-bottom:
        20px;


      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.9
        );


      box-shadow:
        0 8px 24px
        rgba(
          57,
          94,
          135,
          0.10
        );


      backdrop-filter:
        blur(5px);

    }



    .card::after {

      content:
        "";


      position:
        absolute;


      left:
        18px;


      right:
        18px;


      bottom:
        -1px;


      height:
        2px;


      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(
            112,
            165,
            198,
            0.16
          ),
          transparent
        );

    }



    /* ===================================
       プロフィールカード
    =================================== */

    .profile-card {

      max-width:
        600px;

      margin:
        0 auto 20px;


      text-align:
        center;


      padding:
        28px 30px;


      background:
        linear-gradient(
          180deg,
          rgba(
            255,
            255,
            255,
            0.97
          )
          0%,

          rgba(
            255,
            255,
            255,
            0.97
          )
          72%,

          rgba(
            225,
            247,
            222,
            0.95
          )
          100%
        );


      border:
        2px solid
        rgba(
          255,
          255,
          255,
          0.95
        );

    }



    /* ===================================
       ユーザー名
    =================================== */

    .username {

      display:
        inline-block;


      margin-bottom:
        20px;


      padding:
        8px 15px;


      background:
        #ffffff;


      border:
        2px solid
        #324668;


      border-radius:
        9px;


      box-shadow:
        3px 3px 0
        #cce8ed;


      font-size:
        14px;


      font-weight:
        900;


      color:
        #203354;

    }



    /* ===================================
       キャラクター
    =================================== */

    .character-area {

      display:
        flex;


      flex-direction:
        column;


      align-items:
        center;

    }



    /* ===================================
       スライム画像
    =================================== */

    .character-icon {

      width:
        180px;


      height:
        180px;


      object-fit:
        contain;


      display:
        block;


      margin:
        0 auto 12px;


      filter:
        drop-shadow(
          0 7px 5px
          rgba(
            50,
            70,
            90,
            0.14
          )
        );

    }



    /* ===================================
       キャラクター情報ボックス
    =================================== */

    .character-details {

      width:
        min(
          100%,
          340px
        );


      background:
        #ffffff;


      border:
        2px solid
        #324668;


      border-radius:
        10px;


      padding:
        14px 17px;


      box-shadow:
        4px 4px 0
        #cce8ed;


      margin-bottom:
        24px;

    }



    /* ===================================
       キャラクター名
    =================================== */

    .character-name {

      font-size:
        19px;


      font-weight:
        900;


      margin-bottom:
        6px;


      color:
        #203354;

    }



    /* ===================================
       レベル
    =================================== */

    .character-level {

      font-size:
        20px;


      font-weight:
        900;


      color:
        #5d55b7;

    }



    /* ===================================
       EXPエリア
    =================================== */

    .exp-area {

      width:
        min(
          100%,
          430px
        );


      margin:
        0 auto;

    }



    .exp-info {

      display:
        flex;


      justify-content:
        space-between;


      margin-bottom:
        7px;


      font-size:
        12px;


      font-weight:
        bold;


      color:
        #43516b;

    }



    /* ===================================
       EXPゲージ
       indexと同じ
    =================================== */

    .exp-bar {

      width:
        100%;


      height:
        13px;


      background:
        #edf1f5;


      border:
        1px solid
        #9ba7b8;


      border-radius:
        4px;


      overflow:
        hidden;

    }



    .exp-fill {

      width:
        0%;


      height:
        100%;


      background:
        linear-gradient(
          90deg,
          #79c95d,
          #9ade70
        );


      border-radius:
        3px;


      transition:
        width 0.5s ease;

    }



    /* ===================================
       累計EXP
    =================================== */

    .total-exp {

      margin-top:
        12px;


      margin-bottom:
        0;


      font-size:
        11px;


      color:
        #718096;

    }



    /* ===================================
       戻るリンク
    =================================== */

    .back-area {

      text-align:
        center;


      margin-top:
        22px;


      margin-bottom:
        50px;

    }



    .back-link {

      display:
        inline-block;


      padding:
        11px 18px;


      background:
        rgba(
          255,
          255,
          255,
          0.75
        );


      color:
        #5e65a6;


      text-decoration:
        none;


      border-radius:
        10px;


      font-size:
        13px;


      font-weight:
        bold;


      box-shadow:
        0 4px 12px
        rgba(
          50,
          70,
          100,
          0.07
        );


      transition:
        0.2s;

    }



    .back-link:hover {

      background:
        white;


      transform:
        translateY(-1px);

    }



    /* ===================================
       RPG風フッター
       indexと同じ設定
    =================================== */

    .rpg-footer-background {

      position:
        relative;


      width:
        calc(
          100% + 40px
        );


      margin-left:
        -20px;


      /* 元画像：2156 × 325 */

      aspect-ratio:
        2156 / 325;


      background-image:
        url(
          "images/rpg-footer.png"
        );


      background-repeat:
        no-repeat;


      background-size:
        100% auto;


      background-position:
        right bottom;


      image-rendering:
        pixelated;


      pointer-events:
        none;


      z-index:
        0;


      margin-top:
        -50px;


      margin-bottom:
        0;

    }



    /* ===================================
       スマホ
    =================================== */

    @media (
      max-width:
        600px
    ) {


      body {

        padding:
          18px 12px 0;

      }



      .container {

        margin:
          10px auto 0;

      }



      /* indexと同じヘッダー */

      .rpg-header-background {

        height:
          180px;


        aspect-ratio:
          auto;


        background-size:
          900px auto;


        background-position:
          right top;

      }



      .header-title {

        font-size:
          27px;


        padding:
          8px 20px;


        margin:
          0 auto 4px;


        text-align:
          center;

      }



      .header-space {

        height:
          70px;

      }



      .profile-card {

        padding:
          20px 17px;


        border-radius:
          15px;

      }



      .username {

        font-size:
          12px;


        margin-bottom:
          16px;

      }



      .character-icon {

        width:
          145px;


        height:
          145px;

      }



      .character-details {

        padding:
          12px 13px;


        margin-bottom:
          21px;

      }



      .character-name {

        font-size:
          16px;

      }



      .character-level {

        font-size:
          17px;

      }



      .back-area {

        margin-bottom:
          35px;

      }



      /* indexと同じフッター */

      .rpg-footer-background {

        width:
          calc(
            100% + 24px
          );


        margin-left:
          -12px;


        height:
          180px;


        aspect-ratio:
          auto;


        background-size:
          900px auto;


        background-position:
          right bottom;


        margin-bottom:
          0;

      }

    }



    /* ===================================
       ページ最下部の余白を消す
    =================================== */

    html,
    body {

      margin-bottom:
        0;


      padding-bottom:
        0;

    }


  </style>

</head>


<body>


  <!-- ===================================
       indexと同じRPGヘッダー
  =================================== -->

  <div
    class="rpg-header-background"
    aria-hidden="true"
  ></div>



  <!-- ===================================
       メイン
  =================================== -->

  <div class="container">


    <!-- タイトル -->

    <h1 class="header-title">
      マイページ
    </h1>



    <!-- ヘッダー画像との余白 -->

    <div class="header-space"></div>



    <!-- ===================================
         プロフィール
    =================================== -->

    <div class="card profile-card">


      <!-- ユーザー名 -->

      <div
        id="username"
        class="username"
      >
        読み込み中...
      </div>



      <!-- キャラクター -->

      <div class="character-area">


        <img
          id="characterIcon"
          class="character-icon"
          src="images/mijuku-slime.png"
          alt="未熟なスライム"
        >



        <div class="character-details">


          <div
            id="characterName"
            class="character-name"
          >
            未熟なスライム
          </div>


          <div
            id="characterLevel"
            class="character-level"
          >
            Lv.1
          </div>


        </div>



        <!-- EXP -->

        <div class="exp-area">


          <div class="exp-info">

            <span>
              EXP
            </span>

            <span id="expText">
              0 / 20
            </span>

          </div>



          <div class="exp-bar">

            <div
              id="expFill"
              class="exp-fill"
            ></div>

          </div>


        </div>



        <!-- 累計経験値 -->

        <p
          id="totalExp"
          class="total-exp"
        >
          累計経験値：0 EXP
        </p>


      </div>


    </div>



    <!-- ===================================
         タスク管理へ戻る
    =================================== -->

    <div class="back-area">

      <a
        href="index.html"
        class="back-link"
      >
        ← タスク管理に戻る
      </a>

    </div>


  </div>



  <!-- ===================================
       indexと同じRPGフッター
  =================================== -->

  <div
    class="rpg-footer-background"
    aria-hidden="true"
  ></div>



  <script>


    // =====================================
    // ① Supabase
    // =====================================

    const SUPABASE_URL =
      "https://weftzcfogzqtskhklyft.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_Ue3wX3hwEheWaZAdidm2Fw_cSy3EAj3";


    const db =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    // =====================================
    // ② EXP
    // =====================================

    const TASK_EXP =
      10;


    const DAILY_BONUS_EXP =
      10;


    const DAILY_GOAL =
      5;



    // =====================================
    // ③ レベルテーブル
    // =====================================

    const levelMilestones = [

      [1, 0],

      [2, 20],

      [5, 420],

      [15, 1800],

      [30, 5400],

      [50, 10800]

    ];



    const levelTable =
      Array.from(

        {
          length:
            50
        },

        (_, index) => {


          const level =
            index + 1;



          const upperIndex =
            levelMilestones.findIndex(

              ([milestone]) =>

                milestone >=
                level

            );



          const [

            endLevel,

            endExp

          ] =

            levelMilestones[
              upperIndex
            ];



          if (
            level ===
            endLevel
          ) {

            return endExp;

          }



          const [

            startLevel,

            startExp

          ] =

            levelMilestones[
              upperIndex - 1
            ];



          const ratio =

            (
              level -
              startLevel
            )

            /

            (
              endLevel -
              startLevel
            );



          return Math.round(

            (

              startExp +

              (
                endExp -
                startExp
              )

              *

              ratio

            )

            /

            10

          )

          *

          10;

        }

      );



    // =====================================
    // ④ レベル計算
    // =====================================

    function calculateLevel(
      totalExp
    ) {


      let level =
        1;



      for (

        let i = 0;

        i <
        levelTable.length;

        i++

      ) {


        if (

          totalExp >=
          levelTable[i]

        ) {


          level =
            i + 1;


        }

        else {


          break;


        }

      }



      return level;

    }



    // =====================================
    // ⑤ スライム
    // =====================================

    function getCharacter(
      level
    ) {


      if (
        level >= 50
      ) {

        return {

          name:
            "ゴッドスライム",

          image:
            "images/god-slime.png"

        };

      }



      if (
        level >= 40
      ) {

        return {

          name:
            "キングスライム",

          image:
            "images/king-slime.png"

        };

      }



      if (
        level >= 30
      ) {

        return {

          name:
            "スライム伯爵",

          image:
            "images/slime-hakushaku.png"

        };

      }



      if (
        level >= 15
      ) {

        return {

          name:
            "大人スライム",

          image:
            "images/otona-slime.png"

        };

      }



      if (
        level >= 5
      ) {

        return {

          name:
            "ほどほどのスライム",

          image:
            "images/hodohodo-slime.png"

        };

      }



      return {

        name:
          "未熟なスライム",

        image:
          "images/mijuku-slime.png"

      };

    }



    // =====================================
    // ⑥ EXP計算
    // =====================================

    function calculateTotalExp(
      tasks
    ) {


      const completed =
        tasks.filter(

          task =>

            task.status ===
              "completed"

            &&

            task.completed_at

        );



      const counts =
        {};



      for (
        const task
        of completed
      ) {


        const day =
          new Date(
            task.completed_at
          )

          .toLocaleDateString(
            "sv-SE"
          );



        counts[day] =

          (
            counts[day]
            ||
            0
          )

          +

          1;

      }



      const bonusDays =

        Object.values(
          counts
        )

        .filter(

          count =>

            count >=
            DAILY_GOAL

        )

        .length;



      return (

        completed.length *
        TASK_EXP

        +

        bonusDays *
        DAILY_BONUS_EXP

      );

    }



    // =====================================
    // ⑦ キャラクター表示
    // =====================================

    function renderCharacter(
      totalExp
    ) {


      const level =
        calculateLevel(
          totalExp
        );



      const character =
        getCharacter(
          level
        );



      const characterIcon =
        document.getElementById(
          "characterIcon"
        );



      characterIcon.src =
        character.image;


      characterIcon.alt =
        character.name;



      document
        .getElementById(
          "characterName"
        )
        .textContent =
          character.name;



      document
        .getElementById(
          "characterLevel"
        )
        .textContent =
          "Lv." +
          level;



      if (
        level === 50
      ) {


        document
          .getElementById(
            "expText"
          )
          .textContent =
            "MAX LEVEL";



        document
          .getElementById(
            "expFill"
          )
          .style.width =
            "100%";


      }

      else {


        const currentLevelExp =
          levelTable[
            level - 1
          ];



        const nextLevelExp =
          levelTable[
            level
          ];



        const currentExp =

          totalExp -

          currentLevelExp;



        const requiredExp =

          nextLevelExp -

          currentLevelExp;



        const expPercent =

          (
            currentExp /
            requiredExp
          )

          *

          100;



        document
          .getElementById(
            "expText"
          )
          .textContent =

            currentExp +

            " / " +

            requiredExp;



        document
          .getElementById(
            "expFill"
          )
          .style.width =

            expPercent +

            "%";

      }



      document
        .getElementById(
          "totalExp"
        )
        .textContent =

          "累計経験値：" +

          totalExp +

          " EXP";

    }



    // =====================================
    // ⑧ マイページ読み込み
    // =====================================

    async function loadMyPage() {


      const {

        data:
          authData,

        error:
          authError

      } =

        await db.auth.getUser();



      if (

        authError ||

        !authData.user

      ) {


        window.location.replace(
          "./login.html"
        );


        return;

      }



      const user =
        authData.user;



      // ===================================
      // ユーザー名
      // ===================================

      const {

        data:
          profile,

        error:
          profileError

      } =

        await db

          .from(
            "profiles"
          )

          .select(
            "username"
          )

          .eq(
            "id",
            user.id
          )

          .single();



      if (
        profileError
      ) {


        console.error(
          "プロフィール取得エラー:",
          profileError
        );



        document
          .getElementById(
            "username"
          )
          .textContent =
            "ユーザー名を取得できませんでした";


      }

      else {


        document
          .getElementById(
            "username"
          )
          .textContent =
            profile.username;

      }



      // ===================================
      // 完了済みタスク
      // ===================================

      const {

        data:
          tasks,

        error:
          tasksError

      } =

        await db

          .from(
            "tasks"
          )

          .select(
            "status, completed_at"
          )

          .eq(
            "user_id",
            user.id
          )

          .eq(
            "status",
            "completed"
          );



      if (
        tasksError
      ) {


        console.error(
          "タスク取得エラー:",
          tasksError
        );



        alert(

          "タスクの取得に失敗しました：" +

          tasksError.message

        );


        return;

      }



      const totalExp =
        calculateTotalExp(
          tasks
        );



      renderCharacter(
        totalExp
      );

    }



    // =====================================
    // ⑨ 初期表示
    // =====================================

    loadMyPage();


  </script>


</body>

</html>
