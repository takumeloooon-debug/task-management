<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>タスク管理アプリ</title>


  <style>

    /* ===================================
       全体
    =================================== */

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #f7f7fb;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }


    /* ===================================
       カード
    =================================== */

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 20px;
    }


    /* ===================================
       タスク入力
    =================================== */

    #taskInput {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    #taskInput:focus {
      outline: none;
      border-color: #a78bfa;
    }


    /* ===================================
       タスクの種類
    =================================== */

    .task-type {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .task-type label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .task-type input {
      flex: none;
      width: auto;
      margin: 0;
      accent-color: #a78bfa;
    }


    /* ===================================
       ボタン
    =================================== */

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }

    .add-btn {
      background: #a78bfa;
      color: white;
      font-weight: bold;
      padding: 12px 24px;
    }

    .edit-btn {
      background: #eee9ff;
      color: #7354c5;
    }

    .archive-btn {
      background: #dcfce7;
      color: #15803d;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    .restore-btn {
      background: #e0f2fe;
      color: #0369a1;
    }

    .move-btn {
      background: #e0f2fe;
      color: #0369a1;
    }


    /* ===================================
       タスク一覧
    =================================== */

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .task-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }


    /* ===================================
       アーカイブ
    =================================== */

    .archived-text {
      color: #999;
      text-decoration: line-through;
    }

    .archive-date {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }


    /* ===================================
       今週の日付
    =================================== */

    .week-range {
      font-size: 13px;
      color: #888;
      margin-top: -10px;
      margin-bottom: 20px;
    }


    /* ===================================
       空の状態
    =================================== */

    .empty-message {
      color: #aaa;
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }


    /* ===================================
       過去の記録へのリンク
    =================================== */

    .archive-link {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 40px;
    }

    .archive-link a {
      display: inline-block;
      padding: 12px 20px;
      background: #eee9ff;
      color: #7354c5;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .archive-link a:hover {
      background: #ddd3ff;
    }


    /* ===================================
       スマホ対応
    =================================== */

    @media (max-width: 600px) {

      .container {
        margin: 15px auto;
      }

      .card {
        padding: 18px;
      }

      .task-item {
        flex-direction: column;
        align-items: stretch;
      }

      .task-buttons {
        justify-content: flex-end;
      }

      .task-buttons button {
        padding: 8px 12px;
      }

      .task-type {
        gap: 15px;
      }

    }

  </style>

</head>



<body>

  <div class="container">


    <!-- ===================================
         タイトル
    =================================== -->

    <h1>タスク管理</h1>

    <p class="subtitle">
      今日やることを決めて、一つずつ進めよう。
    </p>



    <!-- ===================================
         タスク登録
    =================================== -->

    <div class="card">

      <h2>新しいタスク</h2>

      <form id="taskForm">


        <!-- タスク入力 -->

        <input
          type="text"
          id="taskInput"
          placeholder="タスクを入力..."
          maxlength="200"
          required
        >


        <!-- タスクの種類を選択 -->

        <div class="task-type">

          <label>

            <input
              type="radio"
              name="taskType"
              value="today"
              checked
            >

            今日やる

          </label>


          <label>

            <input
              type="radio"
              name="taskType"
              value="week"
            >

            今週中にやる

          </label>

        </div>


        <!-- 追加ボタン -->

        <button
          type="submit"
          class="add-btn"
        >

          追加

        </button>

      </form>

    </div>



    <!-- ===================================
         今日やるタスク
    =================================== -->

    <div class="card">

      <h2>今日やるタスク</h2>

      <div id="taskList"></div>

    </div>



    <!-- ===================================
         今週中にやるタスク
    =================================== -->

    <div class="card">

      <h2>今週中にやるタスク</h2>

      <p
        id="weekRange"
        class="week-range"
      ></p>

      <div id="weekTaskList"></div>

    </div>



    <!-- ===================================
         今日完了したタスク
    =================================== -->

    <div class="card">

      <h2>今日完了したタスク</h2>

      <div id="archiveList"></div>

    </div>



    <!-- ===================================
         過去の記録へのリンク
    =================================== -->

    <div class="archive-link">

      <a href="archive.html">
        過去の記録を見る →
      </a>

    </div>


  </div>



  <script>

    // ===================================
    // ① データの読み込み
    // ===================================

    let tasks = [];

    try {

      const savedTasks = JSON.parse(
        localStorage.getItem("tasks") || "[]"
      );

      tasks = Array.isArray(savedTasks)
        ? savedTasks
        : [];

    } catch (error) {

      console.error(
        "タスクの読み込みに失敗しました",
        error
      );

    }



    // ===================================
    // ② データ保存
    // ===================================

    function saveTasks() {

      localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
      );

    }



    // ===================================
    // ③ タスク登録
    // ===================================

    function addTask() {

      const input = document.getElementById("taskInput");

      const text = input.value.trim();


      if (text === "") {
        return;
      }


      // 今日やる・今週中にやるの選択を取得

      const taskType = document.querySelector(
        'input[name="taskType"]:checked'
      ).value;


      // 新しいタスクを作成

      const newTask = {

        id: crypto.randomUUID(),

        text: text,

        taskType: taskType,

        archived: false,

        createdAt: new Date().toISOString(),

        archivedAt: null

      };


      // タスク一覧に追加

      tasks.push(newTask);


      // データ保存

      saveTasks();


      // 画面更新

      renderTasks();


      // 入力欄をリセット

      input.value = "";

      input.focus();

    }



    // ===================================
    // ④ タスク編集
    // ===================================

    function editTask(id) {

      const task = tasks.find(
        task => task.id === id
      );


      if (!task) {
        return;
      }


      const newText = prompt(
        "タスクを編集してください",
        task.text
      );


      if (newText === null) {
        return;
      }


      const trimmedText = newText.trim();


      if (trimmedText === "") {

        alert("タスクを入力してください");

        return;

      }


      if (trimmedText.length > 200) {

        alert("タスクは200文字以内で入力してください");

        return;

      }


      task.text = trimmedText;


      saveTasks();

      renderTasks();

    }



    // ===================================
    // ⑤ タスク削除
    // ===================================

    function deleteTask(id) {

      const confirmed = confirm(
        "このタスクを削除しますか？"
      );


      if (!confirmed) {
        return;
      }


      tasks = tasks.filter(
        task => task.id !== id
      );


      saveTasks();

      renderTasks();

    }



    // ===================================
    // ⑥ タスク完了
    // ===================================

    function archiveTask(id) {

      const task = tasks.find(
        task => task.id === id
      );


      if (!task) {
        return;
      }


      task.archived = true;

      task.archivedAt = new Date().toISOString();


      saveTasks();

      renderTasks();

    }



    // ===================================
    // ⑦ アーカイブから戻す
    // ===================================

    function restoreTask(id) {

      const task = tasks.find(
        task => task.id === id
      );


      if (!task) {
        return;
      }


      task.archived = false;

      task.archivedAt = null;


      saveTasks();

      renderTasks();

    }



    // ===================================
    // ⑧ タスクの種類を変更
    // ===================================

    function moveTask(id, newType) {

      const task = tasks.find(
        task => task.id === id
      );


      if (!task) {
        return;
      }


      task.taskType = newType;


      saveTasks();

      renderTasks();

    }



    // ===================================
    // ⑨ タスク一覧を表示
    // ===================================

    function renderTasks() {

      const taskList = document.getElementById("taskList");

      const weekTaskList = document.getElementById("weekTaskList");

      const archiveList = document.getElementById("archiveList");


      // 表示内容をリセット

      taskList.innerHTML = "";

      weekTaskList.innerHTML = "";

      archiveList.innerHTML = "";


      // ===================================
      // 今日やるタスク
      // ===================================

      const todayTasks = tasks.filter(task => {

        return !task.archived &&
          (task.taskType === "today" || !task.taskType);

      });



      // ===================================
      // 今週中にやるタスク
      // ===================================

      const weekTasks = tasks.filter(task => {

        return !task.archived &&
          task.taskType === "week";

      });



      // ===================================
      // 今日完了したタスク
      // ===================================

      const today = new Date().toLocaleDateString("sv-SE");


      const archivedTasks = tasks.filter(task => {

        if (!task.archived || !task.archivedAt) {
          return false;
        }


        const archivedDate = new Date(
          task.archivedAt
        ).toLocaleDateString("sv-SE");


        return archivedDate === today;

      });



      // ===================================
      // 今日やるタスクを表示
      // ===================================

      if (todayTasks.length === 0) {

        taskList.innerHTML = `
          <p class="empty-message">
            今日やるタスクはありません
          </p>
        `;

      }


      todayTasks.forEach(task => {

        createTaskElement(
          task,
          taskList,
          "today"
        );

      });



      // ===================================
      // 今週中にやるタスクを表示
      // ===================================

      if (weekTasks.length === 0) {

        weekTaskList.innerHTML = `
          <p class="empty-message">
            今週中にやるタスクはありません
          </p>
        `;

      }


      weekTasks.forEach(task => {

        createTaskElement(
          task,
          weekTaskList,
          "week"
        );

      });



      // ===================================
      // 今日完了したタスクを表示
      // ===================================

      if (archivedTasks.length === 0) {

        archiveList.innerHTML = `
          <p class="empty-message">
            今日完了したタスクはありません
          </p>
        `;

      }


      archivedTasks.forEach(task => {

        const item = document.createElement("div");

        item.className = "task-item";


        const textContainer = document.createElement("div");

        textContainer.className = "task-text";


        const text = document.createElement("div");

        text.className = "archived-text";

        text.textContent = task.text;


        const date = document.createElement("div");

        date.className = "archive-date";


        date.textContent =
          "完了日：" +
          new Date(task.archivedAt).toLocaleDateString("ja-JP");


        textContainer.append(
          text,
          date
        );


        const buttons = document.createElement("div");

        buttons.className = "task-buttons";


        // 戻すボタン

        const restoreButton = document.createElement("button");

        restoreButton.className = "restore-btn";

        restoreButton.textContent = "戻す";

        restoreButton.addEventListener("click", () => {

          restoreTask(task.id);

        });



        // 削除ボタン

        const deleteButton = document.createElement("button");

        deleteButton.className = "delete-btn";

        deleteButton.textContent = "削除";

        deleteButton.addEventListener("click", () => {

          deleteTask(task.id);

        });



        buttons.append(
          restoreButton,
          deleteButton
        );


        item.append(
          textContainer,
          buttons
        );


        archiveList.appendChild(item);

      });

    }



    // ===================================
    // ⑩ タスク表示用の関数
    // ===================================

    function createTaskElement(task, container, type) {

      const item = document.createElement("div");

      item.className = "task-item";


      // タスクの内容

      const text = document.createElement("div");

      text.className = "task-text";

      text.textContent = task.text;



      // ボタンの入れ物

      const buttons = document.createElement("div");

      buttons.className = "task-buttons";



      // 編集ボタン

      const editButton = document.createElement("button");

      editButton.className = "edit-btn";

      editButton.textContent = "編集";

      editButton.addEventListener("click", () => {

        editTask(task.id);

      });



      // 完了ボタン

      const archiveButton = document.createElement("button");

      archiveButton.className = "archive-btn";

      archiveButton.textContent = "完了";

      archiveButton.addEventListener("click", () => {

        archiveTask(task.id);

      });



      // タスク移動ボタン

      const moveButton = document.createElement("button");

      moveButton.className = "move-btn";


      if (type === "today") {

        moveButton.textContent = "今週中に移動";

        moveButton.addEventListener("click", () => {

          moveTask(task.id, "week");

        });

      } else {

        moveButton.textContent = "今日やる";

        moveButton.addEventListener("click", () => {

          moveTask(task.id, "today");

        });

      }



      // 削除ボタン

      const deleteButton = document.createElement("button");

      deleteButton.className = "delete-btn";

      deleteButton.textContent = "削除";

      deleteButton.addEventListener("click", () => {

        deleteTask(task.id);

      });



      // ボタンをまとめる

      buttons.append(
        editButton,
        archiveButton,
        moveButton,
        deleteButton
      );


      // タスクを表示

      item.append(
        text,
        buttons
      );


      container.appendChild(item);

    }



    // ===================================
    // ⑪ 今週の期間を表示
    // ===================================

    function showWeekRange() {

      const today = new Date();


      // 今週の月曜日を取得

      const monday = new Date(today);

      const day = today.getDay();

      const diff = day === 0 ? -6 : 1 - day;

      monday.setDate(today.getDate() + diff);


      // 今週の日曜日を取得

      const sunday = new Date(monday);

      sunday.setDate(monday.getDate() + 6);


      // 日付を整形

      const formatDate = date => {

        return date.toLocaleDateString("ja-JP", {

          month: "long",
          day: "numeric",
          weekday: "short"

        });

      };


      // 画面に表示

      document.getElementById("weekRange").textContent =
        formatDate(monday) +
        " 〜 " +
        formatDate(sunday);

    }



    // ===================================
    // ⑫ 登録ボタン・Enterキーの処理
    // ===================================

    document.getElementById("taskForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        addTask();

      });



    // ===================================
    // ⑬ 初期表示
    // ===================================

    renderTasks();

    showWeekRange();


  </script>

</body>

</html>
