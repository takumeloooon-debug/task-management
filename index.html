<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>タスク管理アプリ</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link
  href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
  rel="stylesheet"
>


  <style>

/* ===================================
   基本設定
=================================== */

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  padding: 32px 20px 60px;

  /* 全体をレトロゲームフォントに統一 */
  font-family: "DotGothic16", sans-serif;

  color: #203354;

  min-height: 100vh;

  /*
    空 → 草原っぽい背景
  */
  background:
    linear-gradient(
      180deg,
      #bde8ff 0%,
      #dff3ff 22%,
      #f4faff 55%,
      #eef8f0 100%
    );

  background-attachment: fixed;
}

[hidden] {
  display: none !important;
}


/* ===================================
   全体コンテナ
=================================== */

.container {
  width: 100%;
  max-width: 820px;

  margin: 20px auto 0;

  position: relative;
}


/* ===================================
   タイトル
=================================== */

h1 {
  margin: 0 0 4px;

  font-size: 34px;
  font-weight: 900;

  letter-spacing: 1px;

  color: #142c59;

  text-shadow:
    0 2px 0 rgba(255,255,255,0.8);
}


.subtitle {
  margin: 0 0 26px;

  font-size: 14px;
  font-weight: 600;

  color: #48617c;
}


/* ===================================
   共通カード
=================================== */

.card {
  background:
    rgba(255,255,255,0.94);

  padding: 24px;

  border-radius: 18px;

  margin-bottom: 20px;

  border:
    1px solid rgba(255,255,255,0.9);

  box-shadow:
    0 8px 24px rgba(57, 94, 135, 0.10);

  backdrop-filter: blur(5px);
}


h2 {
  margin-top: 0;
  margin-bottom: 18px;

  font-size: 19px;
  font-weight: 900;

  color: #172d54;
}


/* ===================================
   キャラクターカード
=================================== */

.character-card {
  padding: 22px 24px;

  /*
    キャラクター周辺だけ少し
    草原っぽい色を入れる
  */
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.97) 72%,
      rgba(225,247,222,0.95) 100%
    );

  border:
    2px solid rgba(255,255,255,0.95);
}


.character-summary {
  display: flex;

  align-items: center;

  gap: 20px;
}


/* ===================================
   スライム画像
=================================== */

.character-icon {
  width: 110px;
  height: 110px;

  object-fit: contain;

  display: block;

  flex-shrink: 0;

  /*
    画像の存在感を少し強くする
  */
  filter:
    drop-shadow(
      0 7px 5px rgba(50,70,90,0.14)
    );
}


/* ===================================
   キャラクター情報
=================================== */

.character-details {
  flex: 1;

  min-width: 0;

  background: #ffffff;

  border: 2px solid #324668;

  border-radius: 10px;

  padding: 14px 17px;

  box-shadow:
    4px 4px 0 #cce8ed;
}


.character-name {
  font-size: 18px;

  font-weight: 900;

  margin-bottom: 5px;

  color: #203354;
}


.character-level {
  font-size: 18px;

  font-weight: 900;

  color: #5d55b7;
}


/* ===================================
   マイページ
=================================== */

.mypage-link {
  display: inline-block;

  padding: 9px 13px;

  background: #eeeaff;

  color: #6653c5;

  text-decoration: none;

  border-radius: 9px;

  font-size: 12px;

  font-weight: bold;

  white-space: nowrap;

  flex-shrink: 0;

  transition: 0.2s;
}


.mypage-link:hover {
  background: #ddd5ff;

  transform: translateY(-1px);
}


/* ===================================
   EXP
=================================== */

.exp-area {
  margin-top: 17px;
}


.exp-info {
  display: flex;

  justify-content: space-between;

  margin-bottom: 7px;

  font-size: 12px;

  font-weight: bold;

  color: #43516b;
}


.exp-bar {
  width: 100%;

  height: 13px;

  background: #edf1f5;

  border: 1px solid #9ba7b8;

  border-radius: 4px;

  overflow: hidden;
}


.exp-fill {
  width: 0%;

  height: 100%;

  /*
    参考画像っぽく緑
  */
  background:
    linear-gradient(
      90deg,
      #79c95d,
      #9ade70
    );

  border-radius: 3px;

  transition: width 0.5s ease;
}


.total-exp {
  margin-top: 10px;
  margin-bottom: 0;

  font-size: 11px;

  color: #718096;
}


.daily-progress {
  margin-top: 8px;
  margin-bottom: 0;

  font-size: 11px;

  color: #718096;

  line-height: 1.7;
}


.level-message {
  margin-top: 13px;

  font-size: 14px;

  font-weight: 900;

  color: #6954c5;
}


.level-message:empty {
  display: none;
}


/* ===================================
   タスク入力
=================================== */

#taskInput {
  display: block;

  width: 100%;
  min-width: 0;

  padding: 13px 15px;

  margin-bottom: 15px;

  font-size: 15px;

  color: #27364e;

  background: #fbfdff;

  border: 2px solid #d4dce8;

  border-radius: 9px;

  outline: none;

  transition: 0.2s;
}


#taskInput::placeholder {
  color: #a1abba;
}


#taskInput:focus {
  background: #ffffff;

  border-color: #9581ee;

  box-shadow:
    0 0 0 4px rgba(149,129,238,0.12);
}


/* ===================================
   今日 / 今週 ラジオ
=================================== */

.task-type {
  display: flex;

  gap: 22px;

  margin-bottom: 15px;

  font-size: 13px;

  font-weight: 600;
}


.task-type label {
  display: flex;

  align-items: center;

  gap: 7px;

  cursor: pointer;
}


.task-type input {
  flex: none;

  width: 17px;
  height: 17px;

  margin: 0;

  accent-color: #8674e8;
}


/* ===================================
   ボタン共通
=================================== */

button {
  border: none;

  border-radius: 8px;

  padding: 9px 13px;

  cursor: pointer;

  font-size: 12px;

  font-weight: 700;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    opacity 0.15s ease;
}


button:hover {
  transform: translateY(-1px);

  box-shadow:
    0 4px 10px rgba(50,70,100,0.10);
}


button:active {
  transform: translateY(0);
}


/* ===================================
   追加
=================================== */

.add-btn {
  padding: 12px 26px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #a68af6,
      #8d76ea
    );

  box-shadow:
    0 4px 10px rgba(130,105,220,0.22);
}


/* ===================================
   編集
=================================== */

.edit-btn {
  background: #eeeaff;

  color: #7057cf;
}


/* ===================================
   完了
=================================== */

.archive-btn {
  background: #dcf7df;

  color: #31914a;
}


/* ===================================
   削除
=================================== */

.delete-btn {
  background: #ffe5e7;

  color: #dc626b;
}


/* ===================================
   戻す
=================================== */

.restore-btn {
  background: #dff2ff;

  color: #347fb5;
}


/* ===================================
   移動
=================================== */

.move-btn {
  background: #ddf1ff;

  color: #347fb5;
}


/* ===================================
   タスク
=================================== */

.task-item {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 12px;

  padding: 14px 4px;

  border-bottom: 1px solid #edf0f4;
}


.task-item:last-child {
  border-bottom: none;
}


.task-text {
  flex: 1;

  min-width: 0;

  overflow-wrap: anywhere;

  font-size: 14px;

  font-weight: 600;

  color: #34435d;
}


.task-buttons {
  display: flex;

  gap: 6px;

  flex-wrap: wrap;
}


/* ===================================
   完了済み
=================================== */

.archived-text {
  color: #929baa;

  text-decoration: line-through;
}


.archive-date {
  margin-top: 5px;

  font-size: 11px;

  color: #a4abb6;
}


/* ===================================
   今週の日付
=================================== */

.week-range {
  margin-top: -10px;

  margin-bottom: 16px;

  font-size: 12px;

  color: #8995a5;
}


/* ===================================
   空状態
=================================== */

.empty-message {
  padding: 18px 0;

  text-align: center;

  font-size: 13px;

  color: #a1aab7;
}


/* ===================================
   過去の記録
=================================== */

.archive-link {
  margin-top: 12px;

  margin-bottom: 35px;

  text-align: center;
}


.archive-link a {
  display: inline-block;

  padding: 11px 18px;

  background: rgba(255,255,255,0.75);

  color: #5e65a6;

  text-decoration: none;

  border-radius: 10px;

  font-size: 13px;

  font-weight: bold;

  box-shadow:
    0 4px 12px rgba(50,70,100,0.07);

  transition: 0.2s;
}


.archive-link a:hover {
  background: white;

  transform: translateY(-1px);
}


/* ===================================
   ログアウト
=================================== */

#logoutButton {
  position: absolute;

  top: 5px;
  right: 0;

  padding: 6px 10px;

  background: rgba(255,255,255,0.6);

  color: #718096;

  border: 1px solid rgba(120,140,160,0.15);

  border-radius: 7px;

  font-size: 11px;

  box-shadow: none;
}


#logoutButton:hover {
  background: rgba(255,255,255,0.95);
}


/* ===================================
   通知
=================================== */

#toastArea {
  position: fixed;

  right: 18px;
  bottom: 18px;

  z-index: 1000;

  display: flex;

  flex-direction: column;

  gap: 8px;

  max-width:
    min(360px, calc(100vw - 36px));

  pointer-events: none;
}


.toast {
  padding: 13px 17px;

  color: white;

  background: #344766;

  border-radius: 10px;

  font-size: 13px;

  font-weight: 600;

  line-height: 1.5;

  box-shadow:
    0 7px 22px rgba(30,50,80,0.20);
}


.toast.level-up {
  background:
    linear-gradient(
      135deg,
      #7f68dd,
      #a67ae8
    );
}


/* ===================================
   カードにほんの少しゲーム感
=================================== */

.card {
  position: relative;
}


.card::after {
  content: "";

  position: absolute;

  left: 18px;
  right: 18px;
  bottom: -1px;

  height: 2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(112,165,198,0.16),
      transparent
    );
}


/* ===================================
   スマホ
=================================== */

@media (max-width: 600px) {

  body {
    padding: 18px 12px 40px;
  }


  .container {
    margin: 10px auto 0;
  }


  h1 {
    font-size: 27px;

    padding-right: 80px;
  }


  .subtitle {
    font-size: 12px;

    margin-bottom: 20px;
  }


  .card {
    padding: 18px;

    border-radius: 15px;

    margin-bottom: 15px;
  }


  .character-card {
    padding: 17px;
  }


  .character-summary {
    gap: 11px;
  }


  .character-icon {
    width: 76px;
    height: 76px;
  }


  .character-details {
    padding: 11px 12px;
  }


  .character-name {
    font-size: 14px;
  }


  .character-level {
    font-size: 15px;
  }


  .mypage-link {
    padding: 7px 8px;

    font-size: 10px;
  }


  .task-item {
    flex-direction: column;

    align-items: stretch;

    gap: 9px;
  }


  .task-buttons {
    justify-content: flex-end;
  }


  .task-buttons button {
    padding: 8px 10px;

    font-size: 11px;
  }


  .task-type {
    gap: 15px;

    font-size: 12px;
  }


  #logoutButton {
    top: 2px;

    font-size: 10px;
  }

}
/* ===================================
   RPG風ヘッダー背景
=================================== */

.rpg-header-background {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 240px;

  background-image: url("images/rpg-header.png");

  background-repeat: no-repeat;

  /* 画像の大きさを固定 */
  background-size: 1300px auto;

  /* 城がある右側を基準に配置 */
  background-position: right top;

  image-rendering: pixelated;

  pointer-events: none;

  z-index: 0;
}

    @media (max-width: 600px) {

  .rpg-header-background {
    height: 180px;

    background-size: 800px auto;

    background-position: right top;
  }

}

  </style>

</head>


<body>

  <!-- 雲・草原・城の背景 -->
  <div class="rpg-header-background" aria-hidden="true"></div>

  <div class="container" id="appContainer" hidden>


    <!-- ===================================
         タイトル
    =================================== -->

    <h1>タスク管理</h1>

    <button id="logoutButton">
      ログアウト
    </button>

    <p class="subtitle">
      今日やることを決めて、一つずつ進めよう。
    </p>


    <!-- ===================================
         キャラクター表示
    =================================== -->

    <div class="card character-card">

      <div class="character-summary">

        <img
          id="characterIcon"
          class="character-icon"
          src="images/mijuku-slime.png"
          alt="未熟なスライム"
        >

        <div class="character-details">

          <div
            id="characterName"
            class="character-name"
          >
            未熟なスライム
          </div>

          <div
            id="characterLevel"
            class="character-level"
          >
            Lv.1
          </div>

        </div>

        <a
          href="mypage.html"
          class="mypage-link"
        >
          マイページ →
        </a>

      </div>


      <div class="exp-area">

        <div class="exp-info">
          <span>EXP</span>
          <span id="expText">0 / 20</span>
        </div>

        <div class="exp-bar">
          <div
            id="expFill"
            class="exp-fill"
          ></div>
        </div>

      </div>


      <p
        id="totalExp"
        class="total-exp"
      >
        累計経験値：0 EXP
      </p>


      <p class="daily-progress">

        🎁 1日5件達成でボーナス10 EXP！<br>

        <span id="dailyProgress">
          現在 0 / 5 タスク
        </span>

      </p>


      <p
        id="levelMessage"
        class="level-message"
      ></p>

    </div>


    <!-- ===================================
         タスク登録
    =================================== -->

    <div class="card">

      <h2>✏️新しいタスク</h2>

      <form id="taskForm">

        <input
          type="text"
          id="taskInput"
          placeholder="タスクを入力..."
          maxlength="200"
          required
        >


        <div class="task-type">

          <label>

            <input
              type="radio"
              name="taskType"
              value="today"
              checked
            >

            今日やる

          </label>


          <label>

            <input
              type="radio"
              name="taskType"
              value="week"
            >

            今週中にやる

          </label>

        </div>


        <button
          type="submit"
          class="add-btn"
        >
          追加
        </button>

      </form>

    </div>


    <!-- ===================================
         今日やるタスク
    =================================== -->

    <div class="card">

      <h2>⚔️今日やるタスク</h2>

      <div id="taskList"></div>

    </div>


    <!-- ===================================
         今週中にやるタスク
    =================================== -->

    <div class="card">

      <h2>🗓️今週中にやるタスク</h2>

      <p
        id="weekRange"
        class="week-range"
      ></p>

      <div id="weekTaskList"></div>

    </div>


    <!-- ===================================
         今日完了したタスク
    =================================== -->

    <div class="card">

      <h2>🥇今日完了したタスク</h2>

      <div id="archiveList"></div>

    </div>


    <!-- ===================================
         過去の記録
    =================================== -->

    <div class="archive-link">

      <a href="archive.html">
        過去の記録を見る →
      </a>

    </div>

  </div>


  <div
    id="toastArea"
    role="status"
    aria-live="polite"
    aria-atomic="false"
  ></div>


  <script>

    // =====================================
    // ① Supabaseの設定
    // =====================================

    const SUPABASE_URL =
      "https://weftzcfogzqtskhklyft.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ue3wX3hwEheWaZAdidm2Fw_cSy3EAj3";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // =====================================
    // ② ログイン状態
    // =====================================

    let currentUser = null;

    let tasks = [];

    let expData = {
      totalExp: 0,
      dailyRecords: {}
    };


    async function checkLogin() {

      const { data, error } =
        await supabaseClient.auth.getUser();


      if (error || !data.user) {

        window.location.replace(
          "./login.html"
        );

        return;

      }


      currentUser = data.user;


      try {

        await loadTasks();

        document.getElementById(
          "appContainer"
        ).hidden = false;

        showWeekRange();

      } catch (e) {

        console.error(
          "タスク取得エラー:",
          e
        );

        alert(
          "タスクの取得に失敗しました。tasksのカラムとRLSを確認してください。\n" +
          e.message
        );

      }

    }


    checkLogin();


    // =====================================
    // ③ ログアウト
    // =====================================

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    logoutButton.addEventListener(
      "click",
      async function () {

        const { error } =
          await supabaseClient.auth.signOut();


        if (error) {

          alert(
            "ログアウトに失敗しました：" +
            error.message
          );

          console.error(error);

          return;

        }


        window.location.replace(
          "./login.html"
        );

      }
    );


    // =====================================
    // Supabase → 画面用データ
    // =====================================

    function fromRow(row) {

      return {

        id: row.id,

        text: row.title,

        taskType: row.task_type,

        archived:
          row.status === "completed",

        createdAt:
          row.created_at,

        archivedAt:
          row.completed_at,

        points:
          row.points || 0

      };

    }


    // =====================================
    // タスク読み込み
    // =====================================

    async function loadTasks() {

      const { data, error } =
        await supabaseClient
          .from("tasks")
          .select(
            "id,user_id,title,task_type,status,created_at,completed_at,points"
          )
          .eq(
            "user_id",
            currentUser.id
          )
          .order(
            "created_at",
            { ascending: true }
          );


      if (error) {
        throw error;
      }


      tasks = data.map(fromRow);


      refreshExp();

      renderTasks();

      renderCharacter();

    }


    // =====================================
    // EXP設定
    // =====================================

    const TASK_EXP = 10;

    const DAILY_BONUS_EXP = 10;

    const DAILY_GOAL = 5;


    const dateKey = value =>
      new Date(value)
        .toLocaleDateString("sv-SE");


    function getExpBreakdown() {

      const completed =
        tasks.filter(
          task =>
            task.archived &&
            task.archivedAt
        );


      const counts = {};


      for (const task of completed) {

        const day =
          dateKey(task.archivedAt);

        counts[day] =
          (counts[day] || 0) + 1;

      }


      const bonusDays =
        Object.values(counts)
          .filter(
            count =>
              count >= DAILY_GOAL
          )
          .length;


      return {

        total:
          completed.length * TASK_EXP +
          bonusDays * DAILY_BONUS_EXP,

        counts

      };

    }


    function refreshExp() {

      const { total, counts } =
        getExpBreakdown();


      expData.totalExp = total;


      const todayCount =
        counts[
          dateKey(new Date())
        ] || 0;


      document.getElementById(
        "dailyProgress"
      ).textContent =

        "今日の達成：" +
        todayCount +
        " / 5 タスク" +

        (
          todayCount >= DAILY_GOAL

            ? " 🎉 目標達成！"

            : "（あと" +
              (DAILY_GOAL - todayCount) +
              "件）"
        );

    }


    // =====================================
    // 通知
    // =====================================

    function showToast(
      message,
      levelUp = false
    ) {

      const area =
        document.getElementById(
          "toastArea"
        );


      const toast =
        document.createElement(
          "div"
        );


      toast.className =
        levelUp
          ? "toast level-up"
          : "toast";


      toast.textContent =
        message;


      area.appendChild(
        toast
      );


      setTimeout(
        () => toast.remove(),
        4500
      );

    }


    // =====================================
    // タスク更新
    // =====================================

    async function updateTaskRow(
      id,
      changes
    ) {

      const { error } =
        await supabaseClient
          .from("tasks")
          .update(changes)
          .eq("id", id)
          .eq(
            "user_id",
            currentUser.id
          );


      if (error) {
        throw error;
      }


      await loadTasks();

    }


    function showDbError(error) {

      console.error(error);

      alert(
        "保存に失敗しました。Supabaseの設定を確認してください。\n" +
        error.message
      );

    }


    // =====================================
    // レベルアップに必要な累計経験値
    // =====================================

    const levelMilestones = [

      [1, 0],

      [2, 20],

      [5, 420],

      [15, 1800],

      [30, 5400],

      [50, 10800]

    ];


    const levelTable =
      Array.from(
        { length: 50 },
        (_, index) => {

          const level =
            index + 1;


          const upperIndex =
            levelMilestones.findIndex(
              ([milestone]) =>
                milestone >= level
            );


          const [
            endLevel,
            endExp
          ] =
            levelMilestones[
              upperIndex
            ];


          if (
            level === endLevel
          ) {

            return endExp;

          }


          const [
            startLevel,
            startExp
          ] =
            levelMilestones[
              upperIndex - 1
            ];


          const ratio =
            (
              level -
              startLevel
            ) /
            (
              endLevel -
              startLevel
            );


          return Math.round(
            (
              startExp +
              (
                endExp -
                startExp
              ) *
              ratio
            ) / 10
          ) * 10;

        }
      );


    // =====================================
    // 現在のレベル
    // =====================================

    function calculateLevel(
      totalExp
    ) {

      let level = 1;


      for (
        let i = 0;
        i < levelTable.length;
        i++
      ) {

        if (
          totalExp >=
          levelTable[i]
        ) {

          level =
            i + 1;

        } else {

          break;

        }

      }


      return level;

    }


    // =====================================
    // スライム進化段階
    // =====================================
    //
    // Lv.1〜4
    // 未熟なスライム
    //
    // Lv.5〜14
    // ほどほどのスライム
    //
    // Lv.15〜29
    // 大人スライム
    //
    // Lv.30〜39
    // スライム伯爵
    //
    // Lv.40〜49
    // キングスライム
    //
    // Lv.50
    // ゴッドスライム
    // =====================================

    function getCharacter(level) {


      if (level >= 50) {

        return {

          name:
            "ゴッドスライム",

          image:
            "images/god-slime.png"

        };

      }


      if (level >= 40) {

        return {

          name:
            "キングスライム",

          image:
            "images/king-slime.png"

        };

      }


      if (level >= 30) {

        return {

          name:
            "スライム伯爵",

          image:
            "images/slime-hakushaku.png"

        };

      }


      if (level >= 15) {

        return {

          name:
            "大人スライム",

          image:
            "images/otona-slime.png"

        };

      }


      if (level >= 5) {

        return {

          name:
            "ほどほどのスライム",

          image:
            "images/hodohodo-slime.png"

        };

      }


      return {

        name:
          "未熟なスライム",

        image:
          "images/mijuku-slime.png"

      };

    }


    // =====================================
    // キャラクター表示更新
    // =====================================

    function renderCharacter() {

      const totalExp =
        expData.totalExp;


      const level =
        calculateLevel(
          totalExp
        );


      const character =
        getCharacter(level);


      // ===================================
      // スライム画像
      // ===================================

      const characterIcon =
        document.getElementById(
          "characterIcon"
        );


      characterIcon.src =
        character.image;


      characterIcon.alt =
        character.name;


      // ===================================
      // 名前
      // ===================================

      document.getElementById(
        "characterName"
      ).textContent =
        character.name;


      // ===================================
      // レベル
      // ===================================

      document.getElementById(
        "characterLevel"
      ).textContent =
        "Lv." + level;


      // ===================================
      // EXPゲージ
      // ===================================

      const currentLevelExp =
        levelTable[
          level - 1
        ];


      if (level === 50) {

        document.getElementById(
          "expText"
        ).textContent =
          "MAX LEVEL";


        document.getElementById(
          "expFill"
        ).style.width =
          "100%";

      } else {


        const nextLevelExp =
          levelTable[level];


        const currentExp =
          totalExp -
          currentLevelExp;


        const requiredExp =
          nextLevelExp -
          currentLevelExp;


        const expPercent =
          (
            currentExp /
            requiredExp
          ) * 100;


        document.getElementById(
          "expText"
        ).textContent =
          currentExp +
          " / " +
          requiredExp;


        document.getElementById(
          "expFill"
        ).style.width =
          expPercent + "%";

      }


      // ===================================
      // 累計EXP
      // ===================================

      document.getElementById(
        "totalExp"
      ).textContent =
        "累計経験値：" +
        totalExp +
        " EXP";

    }


    // =====================================
    // タスク追加
    // =====================================

    async function addTask() {

      const input =
        document.getElementById(
          "taskInput"
        );


      const title =
        input.value.trim();


      if (
        !title ||
        !currentUser
      ) {

        return;

      }


      const taskType =
        document.querySelector(
          'input[name="taskType"]:checked'
        ).value;


      try {

        const { error } =
          await supabaseClient
            .from("tasks")
            .insert({

              user_id:
                currentUser.id,

              title,

              task_type:
                taskType,

              status:
                "active",

              points: 0

            });


        if (error) {
          throw error;
        }


        input.value = "";


        await loadTasks();


        input.focus();


      } catch (e) {

        showDbError(e);

      }

    }


    // =====================================
    // タスク編集
    // =====================================

    async function editTask(id) {

      const task =
        tasks.find(
          t => t.id === id
        );


      if (!task) {
        return;
      }


      const title =
        prompt(
          "タスクを編集してください",
          task.text
        );


      if (title === null) {
        return;
      }


      if (
        !title.trim() ||
        title.trim().length > 200
      ) {

        alert(
          "タスクは1〜200文字で入力してください"
        );

        return;

      }


      try {

        await updateTaskRow(
          id,
          {
            title:
              title.trim()
          }
        );

      } catch (e) {

        showDbError(e);

      }

    }


    // =====================================
    // タスク削除
    // =====================================

    async function deleteTask(id) {

      if (
        !confirm(
          "このタスクを削除しますか？"
        )
      ) {

        return;

      }


      const task =
        tasks.find(
          t => t.id === id
        );


      const oldExp =
        expData.totalExp;


      const oldLevel =
        calculateLevel(
          oldExp
        );


      try {

        const { error } =
          await supabaseClient
            .from("tasks")
            .delete()
            .eq(
              "id",
              id
            )
            .eq(
              "user_id",
              currentUser.id
            );


        if (error) {
          throw error;
        }


        await loadTasks();


        if (
          task &&
          task.archived
        ) {

          showToast(
            "🗑️ 完了済みタスクを削除 −" +
            (
              oldExp -
              expData.totalExp
            ) +
            " EXP"
          );


          const newLevel =
            calculateLevel(
              expData.totalExp
            );


          if (
            newLevel <
            oldLevel
          ) {

            showToast(
              "レベル変更：Lv." +
              oldLevel +
              " → Lv." +
              newLevel
            );

          }

        }


      } catch (e) {

        showDbError(e);

      }

    }


    // =====================================
    // タスク完了
    // =====================================

    async function archiveTask(id) {

      const task =
        tasks.find(
          t => t.id === id
        );


      if (
        !task ||
        task.archived
      ) {

        return;

      }


      const oldExp =
        expData.totalExp;


      const oldLevel =
        calculateLevel(
          oldExp
        );


      const beforeToday =
        getExpBreakdown()
          .counts[
            dateKey(new Date())
          ] || 0;


      try {

        await updateTaskRow(
          id,
          {

            status:
              "completed",

            completed_at:
              new Date()
                .toISOString(),

            points:
              TASK_EXP

          }
        );


        const gained =
          expData.totalExp -
          oldExp;


        showToast(
          "✅ タスク完了！ +" +
          gained +
          " EXP"
        );


        const afterToday =
          getExpBreakdown()
            .counts[
              dateKey(new Date())
            ] || 0;


        if (
          beforeToday <
            DAILY_GOAL &&
          afterToday >=
            DAILY_GOAL
        ) {

          showToast(
            "🎯 今日の5タスク達成！ ボーナス +" +
            DAILY_BONUS_EXP +
            " EXP"
          );

        }


        const newLevel =
          calculateLevel(
            expData.totalExp
          );


        if (
  newLevel >
  oldLevel
) {

  // ===============================
  // レベルアップ通知
  // ===============================

  showToast(
    "🎉 LEVEL UP！ Lv." +
    oldLevel +
    " → Lv." +
    newLevel,
    true
  );


  // ===============================
  // 進化チェック
  // ===============================

  const oldCharacter =
    getCharacter(oldLevel);

  const newCharacter =
    getCharacter(newLevel);


  // キャラクターが変わっていたら進化！

  if (
    oldCharacter.name !==
    newCharacter.name
  ) {

    showToast(
      "✨ 進化！「" +
      newCharacter.name +
      "」になった！",
      true
    );

  }

}


      } catch (e) {

        showDbError(e);

      }

    }


    // =====================================
    // 完了取り消し
    // =====================================

    async function restoreTask(id) {

      const task =
        tasks.find(
          t => t.id === id
        );


      if (
        !task ||
        !task.archived
      ) {

        return;

      }


      const oldExp =
        expData.totalExp;


      const oldLevel =
        calculateLevel(
          oldExp
        );


      try {

        await updateTaskRow(
          id,
          {

            status:
              "active",

            completed_at:
              null,

            points:
              0

          }
        );


        showToast(
          "↩️ 完了を取り消しました −" +
          (
            oldExp -
            expData.totalExp
          ) +
          " EXP"
        );


        const newLevel =
          calculateLevel(
            expData.totalExp
          );


        if (
          newLevel <
          oldLevel
        ) {

          showToast(
            "レベル変更：Lv." +
            oldLevel +
            " → Lv." +
            newLevel
          );

        }


      } catch (e) {

        showDbError(e);

      }

    }


    // =====================================
    // タスク移動
    // =====================================

    async function moveTask(
      id,
      newType
    ) {

      try {

        await updateTaskRow(
          id,
          {
            task_type:
              newType
          }
        );

      } catch (e) {

        showDbError(e);

      }

    }


    // =====================================
    // タスク一覧
    // =====================================

    function renderTasks() {

      const taskList =
        document.getElementById(
          "taskList"
        );


      const weekTaskList =
        document.getElementById(
          "weekTaskList"
        );


      const archiveList =
        document.getElementById(
          "archiveList"
        );


      taskList.innerHTML = "";

      weekTaskList.innerHTML = "";

      archiveList.innerHTML = "";


      // ===================================
      // 今日
      // ===================================

      const todayTasks =
        tasks.filter(
          task =>

            !task.archived &&

            (
              task.taskType ===
                "today" ||

              !task.taskType
            )
        );


      // ===================================
      // 今週
      // ===================================

      const weekTasks =
        tasks.filter(
          task =>

            !task.archived &&

            task.taskType ===
              "week"
        );


      // ===================================
      // 今日完了
      // ===================================

      const today =
        new Date()
          .toLocaleDateString(
            "sv-SE"
          );


      const archivedTasks =
        tasks.filter(
          task => {

            if (
              !task.archived ||
              !task.archivedAt
            ) {

              return false;

            }


            const archivedDate =
              new Date(
                task.archivedAt
              )
                .toLocaleDateString(
                  "sv-SE"
                );


            return (
              archivedDate ===
              today
            );

          }
        );


      // ===================================
      // 今日のタスク表示
      // ===================================

      if (
        todayTasks.length === 0
      ) {

        taskList.innerHTML = `
          <p class="empty-message">
            今日やるタスクはありません
          </p>
        `;

      }


      todayTasks.forEach(
        task => {

          createTaskElement(
            task,
            taskList,
            "today"
          );

        }
      );


      // ===================================
      // 今週のタスク表示
      // ===================================

      if (
        weekTasks.length === 0
      ) {

        weekTaskList.innerHTML = `
          <p class="empty-message">
            今週中にやるタスクはありません
          </p>
        `;

      }


      weekTasks.forEach(
        task => {

          createTaskElement(
            task,
            weekTaskList,
            "week"
          );

        }
      );


      // ===================================
      // 完了タスク表示
      // ===================================

      if (
        archivedTasks.length === 0
      ) {

        archiveList.innerHTML = `
          <p class="empty-message">
            今日完了したタスクはありません
          </p>
        `;

      }


      archivedTasks.forEach(
        task => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "task-item";


          const textContainer =
            document.createElement(
              "div"
            );


          textContainer.className =
            "task-text";


          const text =
            document.createElement(
              "div"
            );


          text.className =
            "archived-text";


          text.textContent =
            task.text;


          const date =
            document.createElement(
              "div"
            );


          date.className =
            "archive-date";


          date.textContent =
            "完了日：" +
            new Date(
              task.archivedAt
            )
              .toLocaleDateString(
                "ja-JP"
              );


          textContainer.append(
            text,
            date
          );


          const buttons =
            document.createElement(
              "div"
            );


          buttons.className =
            "task-buttons";


          const restoreButton =
            document.createElement(
              "button"
            );


          restoreButton.className =
            "restore-btn";


          restoreButton.textContent =
            "戻す";


          restoreButton.addEventListener(
            "click",
            () => {

              restoreTask(
                task.id
              );

            }
          );


          const deleteButton =
            document.createElement(
              "button"
            );


          deleteButton.className =
            "delete-btn";


          deleteButton.textContent =
            "削除";


          deleteButton.addEventListener(
            "click",
            () => {

              deleteTask(
                task.id
              );

            }
          );


          buttons.append(
            restoreButton,
            deleteButton
          );


          item.append(
            textContainer,
            buttons
          );


          archiveList.appendChild(
            item
          );

        }
      );

    }


    // =====================================
    // タスク要素作成
    // =====================================

    function createTaskElement(
      task,
      container,
      type
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "task-item";


      const text =
        document.createElement(
          "div"
        );


      text.className =
        "task-text";


      text.textContent =
        task.text;


      const buttons =
        document.createElement(
          "div"
        );


      buttons.className =
        "task-buttons";


      // 編集

      const editButton =
        document.createElement(
          "button"
        );


      editButton.className =
        "edit-btn";


      editButton.textContent =
        "編集";


      editButton.addEventListener(
        "click",
        () => {

          editTask(
            task.id
          );

        }
      );


      // 完了

      const archiveButton =
        document.createElement(
          "button"
        );


      archiveButton.className =
        "archive-btn";


      archiveButton.textContent =
        "完了";


      archiveButton.addEventListener(
        "click",
        () => {

          archiveTask(
            task.id
          );

        }
      );


      // 移動

      const moveButton =
        document.createElement(
          "button"
        );


      moveButton.className =
        "move-btn";


      if (
        type === "today"
      ) {

        moveButton.textContent =
          "今週中に移動";


        moveButton.addEventListener(
          "click",
          () => {

            moveTask(
              task.id,
              "week"
            );

          }
        );

      } else {

        moveButton.textContent =
          "今日やる";


        moveButton.addEventListener(
          "click",
          () => {

            moveTask(
              task.id,
              "today"
            );

          }
        );

      }


      // 削除

      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-btn";


      deleteButton.textContent =
        "削除";


      deleteButton.addEventListener(
        "click",
        () => {

          deleteTask(
            task.id
          );

        }
      );


      buttons.append(
        editButton,
        archiveButton,
        moveButton,
        deleteButton
      );


      item.append(
        text,
        buttons
      );


      container.appendChild(
        item
      );

    }


    // =====================================
    // 今週の期間
    // =====================================

    function showWeekRange() {

      const today =
        new Date();


      const monday =
        new Date(today);


      const day =
        today.getDay();


      const diff =
        day === 0
          ? -6
          : 1 - day;


      monday.setDate(
        today.getDate() +
        diff
      );


      const sunday =
        new Date(monday);


      sunday.setDate(
        monday.getDate() +
        6
      );


      const formatDate =
        date => {

          return date
            .toLocaleDateString(
              "ja-JP",
              {

                month:
                  "long",

                day:
                  "numeric",

                weekday:
                  "short"

              }
            );

        };


      document.getElementById(
        "weekRange"
      ).textContent =

        formatDate(monday) +
        " 〜 " +
        formatDate(sunday);

    }


    // =====================================
    // タスク登録
    // =====================================

    document.getElementById(
      "taskForm"
    )
      .addEventListener(
        "submit",
        function(event) {

          event.preventDefault();

          addTask();

        }
      );

  </script>

</body>
