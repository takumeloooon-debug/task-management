  <style>

    /* ===================================
       全体
    =================================== */

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #f7f7fb;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    [hidden] { display: none !important; }

    .container {
      max-width: 700px;
      margin: 40px auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }


    /* ===================================
       カード
    =================================== */

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 20px;
    }


    /* ===================================
       タスク入力
    =================================== */

    #taskInput {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    #taskInput:focus {
      outline: none;
      border-color: #a78bfa;
    }


    /* ===================================
       タスクの種類
    =================================== */

    .task-type {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .task-type label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .task-type input {
      flex: none;
      width: auto;
      margin: 0;
      accent-color: #a78bfa;
    }


    /* ===================================
       ボタン
    =================================== */

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }

    .add-btn {
      background: #a78bfa;
      color: white;
      font-weight: bold;
      padding: 12px 24px;
    }

    .edit-btn {
      background: #eee9ff;
      color: #7354c5;
    }

    .archive-btn {
      background: #dcfce7;
      color: #15803d;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    .restore-btn {
      background: #e0f2fe;
      color: #0369a1;
    }

    .move-btn {
      background: #e0f2fe;
      color: #0369a1;
    }


    /* ===================================
       タスク一覧
    =================================== */

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .task-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }


    /* ===================================
       アーカイブ
    =================================== */

    .archived-text {
      color: #999;
      text-decoration: line-through;
    }

    .archive-date {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }


    /* ===================================
       今週の日付
    =================================== */

    .week-range {
      font-size: 13px;
      color: #888;
      margin-top: -10px;
      margin-bottom: 20px;
    }


    /* ===================================
       空の状態
    =================================== */

    .empty-message {
      color: #aaa;
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }


    /* ===================================
       過去の記録へのリンク
    =================================== */

    .archive-link {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 40px;
    }

    .archive-link a {
      display: inline-block;
      padding: 12px 20px;
      background: #eee9ff;
      color: #7354c5;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .archive-link a:hover {
      background: #ddd3ff;
    }


    /* ===================================
       スマホ対応
    =================================== */

    @media (max-width: 600px) {

      .container {
        margin: 15px auto;
      }

      .card {
        padding: 18px;
      }

      .task-item {
        flex-direction: column;
        align-items: stretch;
      }

      .task-buttons {
        justify-content: flex-end;
      }

      .task-buttons button {
        padding: 8px 12px;
      }

      .task-type {
        gap: 15px;
      }

    }

    /* ===================================
   キャラクター育成画面
=================================== */

.character-card {
  text-align: center;
}


/* キャラクター表示 */

.character-area {
  padding: 20px 0;
}

.character-icon {
  font-size: 70px;
  margin-bottom: 10px;
}

.character-name {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.character-level {
  font-size: 22px;
  font-weight: bold;
  color: #7354c5;
}


/* ===================================
   経験値ゲージ
=================================== */

.exp-area {
  margin-top: 20px;
}

.exp-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 8px;
}

.exp-bar {

  height: 14px;

  overflow: hidden;
}

.exp-fill {
  width: 0%;
  height: 100%;

}


/* ===================================
   累計経験値
=================================== */

.total-exp {

  margin-top: 12px;
}


/* ===================================
   レベルアップ通知
=================================== */

.level-message {
  font-size: 15px;
  font-weight: bold;
  color: #7354c5;
  margin-top: 15px;
}

.level-message:empty {
  display: none;
}

}

#logoutButton:hover {

}

  <script>

    // =====================================
// ① Supabaseの設定
// =====================================

const SUPABASE_URL = "https://weftzcfogzqtskhklyft.supabase.co";

const SUPABASE_KEY = "sb_publishable_Ue3wX3hwEheWaZAdidm2Fw_cSy3EAj3";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// =====================================
// ② ログイン状態の確認
// =====================================

let currentUser = null;
let tasks = [];
let expData = { totalExp: 0, dailyRecords: {} };

async function checkLogin() {
  const { data, error } = await supabaseClient.auth.getUser();
  if (error || !data.user) {
    window.location.replace('./login.html');
    return;
  }
  currentUser = data.user;
  try {
    await loadTasks();
    document.getElementById('appContainer').hidden = false;
    showWeekRange();
  } catch (e) {
    console.error('タスク取得エラー:', e);
    alert('タスクの取得に失敗しました。tasksのカラムとRLSを確認してください。\n' + e.message);
  }
}
checkLogin();


// =====================================
// ③ ログアウト処理
// =====================================

const logoutButton =
  document.getElementById("logoutButton");

logoutButton.addEventListener("click", async function () {

  console.log("ログアウトボタンが押された！");

  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert("ログアウトに失敗しました：" + error.message);
    console.error(error);
    return;
  }

  window.location.replace("./login.html");

});

// Supabaseの行を画面表示用のタスクに変換
function fromRow(row) {
  return {
    id: row.id, text: row.title, taskType: row.task_type,
    archived: row.status === 'completed',
    createdAt: row.created_at, archivedAt: row.completed_at,
    points: row.points || 0
  };
}

async function loadTasks() {
  const { data, error } = await supabaseClient.from('tasks')
    .select('id,user_id,title,task_type,status,created_at,completed_at,points')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: true });
  if (error) throw error;
  tasks = data.map(fromRow);
  refreshExp();
  renderTasks();
  renderCharacter();
}

// 完了済みタスクの獲得ポイントから経験値を復元する
function refreshExp() {
  expData.totalExp = tasks.reduce((sum, task) => sum + (task.points || 0), 0);
}

// 同日の完了順に応じて経験値を決める（1件目100、2・3件目5、以降0）
function calculateTaskPoints() {
  const today = new Date().toLocaleDateString('sv-SE');
  const count = tasks.filter(task => task.archivedAt &&
    new Date(task.archivedAt).toLocaleDateString('sv-SE') === today).length;
  return count === 0 ? 100 : count < 3 ? 5 : 0;
}

async function updateTaskRow(id, changes) {
  const { error } = await supabaseClient.from('tasks').update(changes)
    .eq('id', id).eq('user_id', currentUser.id);
  if (error) throw error;
  await loadTasks();
}

function showDbError(error) {
  console.error(error);
  alert('保存に失敗しました。Supabaseの設定を確認してください。\n' + error.message);
}



// ===================================
// レベルアップに必要な累計経験値
// ===================================

const levelTable = [

  0,      // Lv.1

  100,    // Lv.2
  300,    // Lv.3
  500,    // Lv.4
  700,    // Lv.5

  900,    // Lv.6
  1100,   // Lv.7
  1300,   // Lv.8
  1500,   // Lv.9
  1700,   // Lv.10

  1900,   // Lv.11
  2100,   // Lv.12
  2400,   // Lv.13
  2700,   // Lv.14
  3000,   // Lv.15

  3300,   // Lv.16
  3700,   // Lv.17
  4100,   // Lv.18
  4500,   // Lv.19
  4900,   // Lv.20

  5300,   // Lv.21
  5700,   // Lv.22
  6100,   // Lv.23
  6500,   // Lv.24
  6900,   // Lv.25

  7300,   // Lv.26
  7700,   // Lv.27
  8100,   // Lv.28
  8500,   // Lv.29
  9000,   // Lv.30

  9600,   // Lv.31
  10200,  // Lv.32
  10800,  // Lv.33
  11400,  // Lv.34
  12000,  // Lv.35

  12700,  // Lv.36
  13400,  // Lv.37
  14100,  // Lv.38
  14800,  // Lv.39
  15500,  // Lv.40

  16200,  // Lv.41
  16900,  // Lv.42
  18000,  // Lv.43

  19500,  // Lv.44
  21000,  // Lv.45
  23500,  // Lv.46
  26000,  // Lv.47
  29000,  // Lv.48
  32500,  // Lv.49
  36500   // Lv.50

];

    // ===================================
// 現在のレベルを計算
// ===================================

function calculateLevel(totalExp) {

  let level = 1;


  for (let i = 0; i < levelTable.length; i++) {

    if (totalExp >= levelTable[i]) {

      level = i + 1;

    } else {

      break;

    }

  }


  return level;

}

    // ===================================
// キャラクターの進化段階
// ===================================

function getCharacter(level) {

  if (level >= 50) {

    return {
      name: "伝説のドラゴン",
      icon: "🐲"
    };

  }


  if (level >= 43) {

    return {
      name: "ドラゴン",
      icon: "🐉"
    };

  }


  if (level >= 30) {

    return {
      name: "ドラゴンの幼体",
      icon: "🥚"
    };

  }


  if (level >= 15) {

    return {
      name: "スライムキング",
      icon: "👑"
    };

  }


  if (level >= 5) {

    return {
      name: "成長したスライム",
      icon: "💙"
    };

  }


  return {
    name: "スライム",
    icon: "💧"
  };

}

    // ===================================
// 経験値獲得
// ===================================

// 経験値はtasks.pointsの合計から計算するため、別途保存しない。


// ===================================
// 育成画面を更新
// ===================================

function renderCharacter() {

  const totalExp = expData.totalExp;


  // 現在のレベル

  const level = calculateLevel(totalExp);


  // キャラクターの情報

  const character = getCharacter(level);


  // キャラクター表示

  document.getElementById("characterIcon").textContent =
    character.icon;


  document.getElementById("characterName").textContent =
    character.name;


  document.getElementById("characterLevel").textContent =
    "Lv." + level;



  // ===================================
  // 経験値ゲージ
  // ===================================

  const currentLevelExp = levelTable[level - 1];


  // 最大レベルの場合

  if (level === 50) {

    document.getElementById("expText").textContent =
      "MAX LEVEL";


    document.getElementById("expFill").style.width =
      "100%";

  } else {

    // 次のレベルに必要な累計経験値

    const nextLevelExp = levelTable[level];


    // 現在のレベル内で獲得した経験値

    const currentExp = totalExp - currentLevelExp;


    // 次のレベルまでに必要な経験値

    const requiredExp = nextLevelExp - currentLevelExp;


    // 経験値ゲージの割合

    const expPercent =
      (currentExp / requiredExp) * 100;


    // 画面に反映

    document.getElementById("expText").textContent =
      currentExp + " / " + requiredExp;


    document.getElementById("expFill").style.width =
      expPercent + "%";

  }



  // 累計経験値

  document.getElementById("totalExp").textContent =
    "累計経験値：" + totalExp + " EXP";

}



// タスク登録・編集・削除・完了・復元・移動
async function addTask() {
  const input = document.getElementById('taskInput');
  const title = input.value.trim();
  if (!title || !currentUser) return;
  const taskType = document.querySelector('input[name="taskType"]:checked').value;
  try {
    const { error } = await supabaseClient.from('tasks').insert({
      user_id: currentUser.id, title, task_type: taskType,
      status: 'active', points: 0
    });
    if (error) throw error;
    input.value = '';
    await loadTasks();
    input.focus();
  } catch (e) { showDbError(e); }
}

async function editTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  const title = prompt('タスクを編集してください', task.text);
  if (title === null) return;
  if (!title.trim() || title.trim().length > 200) {
    alert('タスクは1〜200文字で入力してください'); return;
  }
  try { await updateTaskRow(id, { title: title.trim() }); }
  catch (e) { showDbError(e); }
}

async function deleteTask(id) {
  if (!confirm('このタスクを削除しますか？')) return;
  try {
    const { error } = await supabaseClient.from('tasks').delete()
      .eq('id', id).eq('user_id', currentUser.id);
    if (error) throw error;
    await loadTasks();
  } catch (e) { showDbError(e); }
}

async function archiveTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task || task.archived) return;
  const oldLevel = calculateLevel(expData.totalExp);
  const points = task.archivedAt ? task.points : calculateTaskPoints();
  try {
    await updateTaskRow(id, {
      status: 'completed', completed_at: new Date().toISOString(), points
    });
    const newLevel = calculateLevel(expData.totalExp);
    document.getElementById('levelMessage').textContent = newLevel > oldLevel
      ? '🎉 LEVEL UP！ Lv.' + newLevel : '+' + points + ' EXP 獲得！';
  } catch (e) { showDbError(e); }
}

async function restoreTask(id) {
  // 完了日時と獲得ポイントを保持し、再完了時の二重付与を防ぐ
  try { await updateTaskRow(id, { status: 'active' }); }
  catch (e) { showDbError(e); }
}

async function moveTask(id, newType) {
  try { await updateTaskRow(id, { task_type: newType }); }
  catch (e) { showDbError(e); }
}



    // ===================================
    // ⑨ タスク一覧を表示
    // ===================================

    function renderTasks() {

      const taskList = document.getElementById("taskList");

      const weekTaskList = document.getElementById("weekTaskList");

      const archiveList = document.getElementById("archiveList");


      // 表示内容をリセット

      taskList.innerHTML = "";

      weekTaskList.innerHTML = "";

      archiveList.innerHTML = "";


      // ===================================
      // 今日やるタスク
      // ===================================

      const todayTasks = tasks.filter(task => {

        return !task.archived &&
          (task.taskType === "today" || !task.taskType);

      });



      // ===================================
      // 今週中にやるタスク
      // ===================================

      const weekTasks = tasks.filter(task => {

        return !task.archived &&
          task.taskType === "week";

      });



      // ===================================
      // 今日完了したタスク
      // ===================================

      const today = new Date().toLocaleDateString("sv-SE");


      const archivedTasks = tasks.filter(task => {

        if (!task.archived || !task.archivedAt) {
          return false;
        }


        const archivedDate = new Date(
          task.archivedAt
        ).toLocaleDateString("sv-SE");


        return archivedDate === today;

      });



      // ===================================
      // 今日やるタスクを表示
      // ===================================

      if (todayTasks.length === 0) {

        taskList.innerHTML = `
          <p class="empty-message">
            今日やるタスクはありません
          </p>
        `;

      }


      todayTasks.forEach(task => {

        createTaskElement(
          task,
          taskList,
          "today"
        );

      });



      // ===================================
      // 今週中にやるタスクを表示
      // ===================================

      if (weekTasks.length === 0) {

        weekTaskList.innerHTML = `
          <p class="empty-message">
            今週中にやるタスクはありません
          </p>
        `;

      }


      weekTasks.forEach(task => {

        createTaskElement(
          task,
          weekTaskList,
          "week"
        );

      });



      // ===================================
      // 今日完了したタスクを表示
      // ===================================

      if (archivedTasks.length === 0) {

        archiveList.innerHTML = `
          <p class="empty-message">
            今日完了したタスクはありません
          </p>
        `;

      }


      archivedTasks.forEach(task => {

        const item = document.createElement("div");

        item.className = "task-item";


        const textContainer = document.createElement("div");

        textContainer.className = "task-text";


        const text = document.createElement("div");

        text.className = "archived-text";

        text.textContent = task.text;


        const date = document.createElement("div");

        date.className = "archive-date";


        date.textContent =
          "完了日：" +
          new Date(task.archivedAt).toLocaleDateString("ja-JP");


        textContainer.append(
          text,
          date
        );


        const buttons = document.createElement("div");

        buttons.className = "task-buttons";


        // 戻すボタン

        const restoreButton = document.createElement("button");

        restoreButton.className = "restore-btn";

        restoreButton.textContent = "戻す";

        restoreButton.addEventListener("click", () => {

          restoreTask(task.id);

        });



        // 削除ボタン

        const deleteButton = document.createElement("button");

        deleteButton.className = "delete-btn";

        deleteButton.textContent = "削除";

        deleteButton.addEventListener("click", () => {

          deleteTask(task.id);

        });



        buttons.append(
          restoreButton,
          deleteButton
        );


        item.append(
          textContainer,
          buttons
        );


        archiveList.appendChild(item);

      });

    }



    // ===================================
    // ⑩ タスク表示用の関数
    // ===================================

    function createTaskElement(task, container, type) {

      const item = document.createElement("div");

      item.className = "task-item";


      // タスクの内容

      const text = document.createElement("div");

      text.className = "task-text";

      text.textContent = task.text;



      // ボタンの入れ物

      const buttons = document.createElement("div");

      buttons.className = "task-buttons";



      // 編集ボタン

      const editButton = document.createElement("button");

      editButton.className = "edit-btn";

      editButton.textContent = "編集";

      editButton.addEventListener("click", () => {

        editTask(task.id);

      });



      // 完了ボタン

      const archiveButton = document.createElement("button");

      archiveButton.className = "archive-btn";

      archiveButton.textContent = "完了";

      archiveButton.addEventListener("click", () => {

        archiveTask(task.id);

      });



      // タスク移動ボタン

      const moveButton = document.createElement("button");

      moveButton.className = "move-btn";


      if (type === "today") {

        moveButton.textContent = "今週中に移動";

        moveButton.addEventListener("click", () => {

          moveTask(task.id, "week");

        });

      } else {

        moveButton.textContent = "今日やる";

        moveButton.addEventListener("click", () => {

          moveTask(task.id, "today");

        });

      }



      // 削除ボタン

      const deleteButton = document.createElement("button");

      deleteButton.className = "delete-btn";

      deleteButton.textContent = "削除";

      deleteButton.addEventListener("click", () => {

        deleteTask(task.id);

      });



      // ボタンをまとめる

      buttons.append(
        editButton,
        archiveButton,
        moveButton,
        deleteButton
      );


      // タスクを表示

      item.append(
        text,
        buttons
      );


      container.appendChild(item);

    }



    // ===================================
    // ⑪ 今週の期間を表示
    // ===================================

    function showWeekRange() {

      const today = new Date();


      // 今週の月曜日を取得

      const monday = new Date(today);

      const day = today.getDay();

      const diff = day === 0 ? -6 : 1 - day;

      monday.setDate(today.getDate() + diff);


      // 今週の日曜日を取得

      const sunday = new Date(monday);

      sunday.setDate(monday.getDate() + 6);


      // 日付を整形

      const formatDate = date => {

        return date.toLocaleDateString("ja-JP", {

          month: "long",
          day: "numeric",
          weekday: "short"

        });

      };


      // 画面に表示

      document.getElementById("weekRange").textContent =
        formatDate(monday) +
        " 〜 " +
        formatDate(sunday);

    }



    // ===================================
    // ⑫ 登録ボタン・Enterキーの処理
    // ===================================

    document.getElementById("taskForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        addTask();

      });
