<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>タスク管理アプリ</title>


  <style>

    /* ===================================
       全体
    =================================== */

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #f7f7fb;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }


    /* ===================================
       カード
    =================================== */

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 20px;
    }


    /* ===================================
       タスク入力
    =================================== */

    #taskInput {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    #taskInput:focus {
      outline: none;
      border-color: #a78bfa;
    }


    /* ===================================
       タスクの種類
    =================================== */

    .task-type {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .task-type label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .task-type input {
      flex: none;
      width: auto;
      margin: 0;
      accent-color: #a78bfa;
    }


    /* ===================================
       ボタン
    =================================== */

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }

    .add-btn {
      background: #a78bfa;
      color: white;
      font-weight: bold;
      padding: 12px 24px;
    }

    .edit-btn {
      background: #eee9ff;
      color: #7354c5;
    }

    .archive-btn {
      background: #dcfce7;
      color: #15803d;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    .restore-btn {
      background: #e0f2fe;
      color: #0369a1;
    }

    .move-btn {
      background: #e0f2fe;
      color: #0369a1;
    }


    /* ===================================
       タスク一覧
    =================================== */

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .task-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }


    /* ===================================
       アーカイブ
    =================================== */

    .archived-text {
      color: #999;
      text-decoration: line-through;
    }

    .archive-date {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }


    /* ===================================
       今週の日付
    =================================== */

    .week-range {
      font-size: 13px;
      color: #888;
      margin-top: -10px;
      margin-bottom: 20px;
    }


    /* ===================================
       空の状態
    =================================== */

    .empty-message {
      color: #aaa;
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }


    /* ===================================
       過去の記録へのリンク
    =================================== */

    .archive-link {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 40px;
    }

    .archive-link a {
      display: inline-block;
      padding: 12px 20px;
      background: #eee9ff;
      color: #7354c5;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .archive-link a:hover {
      background: #ddd3ff;
    }


    /* ===================================
       スマホ対応
    =================================== */

    @media (max-width: 600px) {

      .container {
        margin: 15px auto;
      }

      .card {
        padding: 18px;
      }

      .task-item {
        flex-direction: column;
        align-items: stretch;
      }

      .task-buttons {
        justify-content: flex-end;
      }

      .task-buttons button {
        padding: 8px 12px;
      }

      .task-type {
        gap: 15px;
      }

    }

    /* ===================================
   キャラクター育成画面
=================================== */

.character-card {
  text-align: center;
}


/* キャラクター表示 */

.character-area {
  padding: 20px 0;
}

.character-icon {
  font-size: 70px;
  margin-bottom: 10px;
}

.character-name {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.character-level {
  font-size: 22px;
  font-weight: bold;
  color: #7354c5;
}


/* ===================================
   経験値ゲージ
=================================== */

.exp-area {
  margin-top: 20px;
}

.exp-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 8px;
}

.exp-bar {
  width: 100%;
  height: 14px;
  background: #eee9ff;
  border-radius: 10px;
  overflow: hidden;
}

.exp-fill {
  width: 0%;
  height: 100%;
  background: #a78bfa;
  border-radius: 10px;
  transition: width 0.5s ease;
}


/* ===================================
   累計経験値
=================================== */

.total-exp {
  font-size: 12px;
  color: #888;
  margin-top: 12px;
}


/* ===================================
   レベルアップ通知
=================================== */

.level-message {
  font-size: 15px;
  font-weight: bold;
  color: #7354c5;
  margin-top: 15px;
}

.level-message:empty {
  display: none;
}

  </style>

</head>



<body>

  <div class="container">


    <!-- ===================================
         タイトル
    =================================== -->

    <h1>タスク管理</h1>

    <p class="subtitle">
      今日やることを決めて、一つずつ進めよう。
    </p>

    <!-- ===================================
     キャラクター育成画面
=================================== -->

<div class="card character-card">

  <h2>キャラクター育成</h2>

  <!-- キャラクター表示 -->

  <div class="character-area">

    <div id="characterIcon" class="character-icon">
      💧
    </div>

    <div id="characterName" class="character-name">
      スライム
    </div>

    <div id="characterLevel" class="character-level">
      Lv.1
    </div>

  </div>


  <!-- 経験値ゲージ -->

  <div class="exp-area">

    <div class="exp-info">

      <span>EXP</span>

      <span id="expText">
        0 / 200
      </span>

    </div>


    <div class="exp-bar">

      <div
        id="expFill"
        class="exp-fill"
      ></div>

    </div>

  </div>


  <!-- 累計経験値 -->

  <p id="totalExp" class="total-exp">
    累計経験値：0 EXP
  </p>


  <!-- レベルアップ通知 -->

  <p id="levelMessage" class="level-message"></p>

</div>


    <!-- ===================================
         タスク登録
    =================================== -->

    <div class="card">

      <h2>新しいタスク</h2>

      <form id="taskForm">


        <!-- タスク入力 -->

        <input
          type="text"
          id="taskInput"
          placeholder="タスクを入力..."
          maxlength="200"
          required
        >


        <!-- タスクの種類を選択 -->

        <div class="task-type">

          <label>

            <input
              type="radio"
              name="taskType"
              value="today"
              checked
            >

            今日やる

          </label>


          <label>

            <input
              type="radio"
              name="taskType"
              value="week"
            >

            今週中にやる

          </label>

        </div>


        <!-- 追加ボタン -->

        <button
          type="submit"
          class="add-btn"
        >

          追加

        </button>

      </form>

    </div>



    <!-- ===================================
         今日やるタスク
    =================================== -->

    <div class="card">

      <h2>今日やるタスク</h2>

      <div id="taskList"></div>

    </div>



    <!-- ===================================
         今週中にやるタスク
    =================================== -->

    <div class="card">

      <h2>今週中にやるタスク</h2>

      <p
        id="weekRange"
        class="week-range"
      ></p>

      <div id="weekTaskList"></div>

    </div>



    <!-- ===================================
         今日完了したタスク
    =================================== -->

    <div class="card">

      <h2>今日完了したタスク</h2>

      <div id="archiveList"></div>

    </div>



    <!-- ===================================
         過去の記録へのリンク
    =================================== -->

    <div class="archive-link">

      <a href="archive.html">
        過去の記録を見る →
      </a>

    </div>


  </div>



  <script>

    // ===================================
    // ① データの読み込み
    // ===================================

    let tasks = [];

    try {

      const savedTasks = JSON.parse(
        localStorage.getItem("tasks") || "[]"
      );

      tasks = Array.isArray(savedTasks)
        ? savedTasks
        : [];

    } catch (error) {

      console.error(
        "タスクの読み込みに失敗しました",
        error
      );

    }



    // ===================================
    // ② データ保存
    // ===================================

    function saveTasks() {

      localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
      );

    }

    // ===================================
// 経験値データの読み込み
// ===================================

const EXP_STORAGE_KEY = "taskAppExp";

let expData = {
  totalExp: 0,
  dailyRecords: {}
};


// 保存済みの経験値データを読み込む

try {

  const savedExp = JSON.parse(
    localStorage.getItem(EXP_STORAGE_KEY) || "null"
  );

  if (savedExp) {

    expData = savedExp;

  }

} catch (error) {

  console.error(
    "経験値データの読み込みに失敗しました",
    error
  );

}


// 経験値データを保存する

function saveExpData() {

  localStorage.setItem(
    EXP_STORAGE_KEY,
    JSON.stringify(expData)
  );

}

    // ===================================
// レベルアップに必要な累計経験値
// ===================================

const levelTable = [

  0,      // Lv.1

  100,    // Lv.2
  300,    // Lv.3
  500,    // Lv.4
  700,    // Lv.5

  900,    // Lv.6
  1100,   // Lv.7
  1300,   // Lv.8
  1500,   // Lv.9
  1700,   // Lv.10

  1900,   // Lv.11
  2100,   // Lv.12
  2400,   // Lv.13
  2700,   // Lv.14
  3000,   // Lv.15

  3300,   // Lv.16
  3700,   // Lv.17
  4100,   // Lv.18
  4500,   // Lv.19
  4900,   // Lv.20

  5300,   // Lv.21
  5700,   // Lv.22
  6100,   // Lv.23
  6500,   // Lv.24
  6900,   // Lv.25

  7300,   // Lv.26
  7700,   // Lv.27
  8100,   // Lv.28
  8500,   // Lv.29
  9000,   // Lv.30

  9600,   // Lv.31
  10200,  // Lv.32
  10800,  // Lv.33
  11400,  // Lv.34
  12000,  // Lv.35

  12700,  // Lv.36
  13400,  // Lv.37
  14100,  // Lv.38
  14800,  // Lv.39
  15500,  // Lv.40

  16200,  // Lv.41
  16900,  // Lv.42
  18000,  // Lv.43

  19500,  // Lv.44
  21000,  // Lv.45
  23500,  // Lv.46
  26000,  // Lv.47
  29000,  // Lv.48
  32500,  // Lv.49
  36500   // Lv.50

];

    // ===================================
// 現在のレベルを計算
// ===================================

function calculateLevel(totalExp) {

  let level = 1;


  for (let i = 0; i < levelTable.length; i++) {

    if (totalExp >= levelTable[i]) {

      level = i + 1;

    } else {

      break;

    }

  }


  return level;

}

    // ===================================
// キャラクターの進化段階
// ===================================

function getCharacter(level) {

  if (level >= 50) {

    return {
      name: "伝説のドラゴン",
      icon: "🐲"
    };

  }


  if (level >= 43) {

    return {
      name: "ドラゴン",
      icon: "🐉"
    };

  }


  if (level >= 30) {

    return {
      name: "ドラゴンの幼体",
      icon: "🥚"
    };

  }


  if (level >= 15) {

    return {
      name: "スライムキング",
      icon: "👑"
    };

  }


  if (level >= 5) {

    return {
      name: "成長したスライム",
      icon: "💙"
    };

  }


  return {
    name: "スライム",
    icon: "💧"
  };

}

    // ===================================
// 経験値獲得
// ===================================

function gainExp(taskId) {

  const today = new Date().toLocaleDateString("sv-SE");


  // 今日の記録がなければ作成

  if (!expData.dailyRecords[today]) {

    expData.dailyRecords[today] = {

      completedCount: 0,

      earnedExp: 0,

      rewardedTaskIds: []

    };

  }


  const record = expData.dailyRecords[today];

// 過去の日付も含め、同じタスクで経験値を獲得済みか確認する

const alreadyRewarded = Object.values(
  expData.dailyRecords
).some(record => {

  return (record.rewardedTaskIds || []).includes(taskId);

});

if (alreadyRewarded) {
  return 0;
}


  // 今日の完了数を取得

  const completedCount = record.completedCount;


  // 獲得経験値を決定

  let gainedExp = 0;


  if (completedCount === 0) {

    gainedExp = 100;

  } else if (completedCount === 1) {

    gainedExp = 5;

  } else if (completedCount === 2) {

    gainedExp = 5;

  }


  // 完了数を更新

  record.completedCount += 1;


  // 経験値を獲得したタスクを記録

  record.rewardedTaskIds.push(taskId);


  // 経験値を更新

  record.earnedExp += gainedExp;

  expData.totalExp += gainedExp;


  // データを保存

  saveExpData();


  return gainedExp;

}

    // ===================================
// 育成画面を更新
// ===================================

function renderCharacter() {

  const totalExp = expData.totalExp;


  // 現在のレベル

  const level = calculateLevel(totalExp);


  // キャラクターの情報

  const character = getCharacter(level);


  // キャラクター表示

  document.getElementById("characterIcon").textContent =
    character.icon;


  document.getElementById("characterName").textContent =
    character.name;


  document.getElementById("characterLevel").textContent =
    "Lv." + level;



  // ===================================
  // 経験値ゲージ
  // ===================================

  const currentLevelExp = levelTable[level - 1];


  // 最大レベルの場合

  if (level === 50) {

    document.getElementById("expText").textContent =
      "MAX LEVEL";


    document.getElementById("expFill").style.width =
      "100%";

  } else {

    // 次のレベルに必要な累計経験値

    const nextLevelExp = levelTable[level];


    // 現在のレベル内で獲得した経験値

    const currentExp = totalExp - currentLevelExp;


    // 次のレベルまでに必要な経験値

    const requiredExp = nextLevelExp - currentLevelExp;


    // 経験値ゲージの割合

    const expPercent =
      (currentExp / requiredExp) * 100;


    // 画面に反映

    document.getElementById("expText").textContent =
      currentExp + " / " + requiredExp;


    document.getElementById("expFill").style.width =
      expPercent + "%";

  }



  // 累計経験値

  document.getElementById("totalExp").textContent =
    "累計経験値：" + totalExp + " EXP";

}



    // ===================================
    // ③ タスク登録
    // ===================================

    function addTask() {

      const input = document.getElementById("taskInput");

      const text = input.value.trim();


      if (text === "") {
        return;
      }


      // 今日やる・今週中にやるの選択を取得

      const taskType = document.querySelector(
        'input[name="taskType"]:checked'
      ).value;


      // 新しいタスクを作成

      const newTask = {

        id: crypto.randomUUID(),

        text: text,

        taskType: taskType,

        archived: false,

        createdAt: new Date().toISOString(),

        archivedAt: null

      };


      // タスク一覧に追加

      tasks.push(newTask);


      // データ保存

      saveTasks();


      // 画面更新

      renderTasks();


      // 入力欄をリセット

      input.value = "";

      input.focus();

    }



    // ===================================
    // ④ タスク編集
    // ===================================

    function editTask(id) {

      const task = tasks.find(
        task => task.id === id
      );


      if (!task) {
        return;
      }


      const newText = prompt(
        "タスクを編集してください",
        task.text
      );


      if (newText === null) {
        return;
      }


      const trimmedText = newText.trim();


      if (trimmedText === "") {

        alert("タスクを入力してください");

        return;

      }


      if (trimmedText.length > 200) {

        alert("タスクは200文字以内で入力してください");

        return;

      }


      task.text = trimmedText;


      saveTasks();

      renderTasks();

    }



    // ===================================
    // ⑤ タスク削除
    // ===================================

    function deleteTask(id) {

      const confirmed = confirm(
        "このタスクを削除しますか？"
      );


      if (!confirmed) {
        return;
      }


      tasks = tasks.filter(
        task => task.id !== id
      );


      saveTasks();

      renderTasks();

    }

// ===================================
// タスク完了
// ===================================

function archiveTask(id) {

  const task = tasks.find(
    task => task.id === id
  );


  if (!task) {
    return;
  }


  // すでに完了している場合は処理しない

  if (task.archived) {
    return;
  }


  // 完了前のレベルを取得

  const oldLevel = calculateLevel(
    expData.totalExp
  );


  // タスクを完了状態にする

  task.archived = true;

  task.archivedAt = new Date().toISOString();


  // タスクを保存

  saveTasks();


  // 経験値を獲得

  const gainedExp = gainExp(id);


  // 完了後のレベルを取得

  const newLevel = calculateLevel(
    expData.totalExp
  );


  // タスク一覧を更新

  renderTasks();


  // キャラクター表示を更新

  renderCharacter();


  // ===================================
  // レベルアップ通知
  // ===================================

  const message = document.getElementById(
    "levelMessage"
  );


  if (newLevel > oldLevel) {

    message.textContent =
      "🎉 LEVEL UP！ Lv." + newLevel;

  } else {

    message.textContent =
      "+" + gainedExp + " EXP 獲得！";

  }

}

  


    // ===================================
    // ⑦ アーカイブから戻す
    // ===================================

    function restoreTask(id) {

      const task = tasks.find(
        task => task.id === id
      );


      if (!task) {
        return;
      }


      task.archived = false;

      task.archivedAt = null;


      saveTasks();

      renderTasks();

    }



    // ===================================
    // ⑧ タスクの種類を変更
    // ===================================

    function moveTask(id, newType) {

      const task = tasks.find(
        task => task.id === id
      );


      if (!task) {
        return;
      }


      task.taskType = newType;


      saveTasks();

      renderTasks();

    }



    // ===================================
    // ⑨ タスク一覧を表示
    // ===================================

    function renderTasks() {

      const taskList = document.getElementById("taskList");

      const weekTaskList = document.getElementById("weekTaskList");

      const archiveList = document.getElementById("archiveList");


      // 表示内容をリセット

      taskList.innerHTML = "";

      weekTaskList.innerHTML = "";

      archiveList.innerHTML = "";


      // ===================================
      // 今日やるタスク
      // ===================================

      const todayTasks = tasks.filter(task => {

        return !task.archived &&
          (task.taskType === "today" || !task.taskType);

      });



      // ===================================
      // 今週中にやるタスク
      // ===================================

      const weekTasks = tasks.filter(task => {

        return !task.archived &&
          task.taskType === "week";

      });



      // ===================================
      // 今日完了したタスク
      // ===================================

      const today = new Date().toLocaleDateString("sv-SE");


      const archivedTasks = tasks.filter(task => {

        if (!task.archived || !task.archivedAt) {
          return false;
        }


        const archivedDate = new Date(
          task.archivedAt
        ).toLocaleDateString("sv-SE");


        return archivedDate === today;

      });



      // ===================================
      // 今日やるタスクを表示
      // ===================================

      if (todayTasks.length === 0) {

        taskList.innerHTML = `
          <p class="empty-message">
            今日やるタスクはありません
          </p>
        `;

      }


      todayTasks.forEach(task => {

        createTaskElement(
          task,
          taskList,
          "today"
        );

      });



      // ===================================
      // 今週中にやるタスクを表示
      // ===================================

      if (weekTasks.length === 0) {

        weekTaskList.innerHTML = `
          <p class="empty-message">
            今週中にやるタスクはありません
          </p>
        `;

      }


      weekTasks.forEach(task => {

        createTaskElement(
          task,
          weekTaskList,
          "week"
        );

      });



      // ===================================
      // 今日完了したタスクを表示
      // ===================================

      if (archivedTasks.length === 0) {

        archiveList.innerHTML = `
          <p class="empty-message">
            今日完了したタスクはありません
          </p>
        `;

      }


      archivedTasks.forEach(task => {

        const item = document.createElement("div");

        item.className = "task-item";


        const textContainer = document.createElement("div");

        textContainer.className = "task-text";


        const text = document.createElement("div");

        text.className = "archived-text";

        text.textContent = task.text;


        const date = document.createElement("div");

        date.className = "archive-date";


        date.textContent =
          "完了日：" +
          new Date(task.archivedAt).toLocaleDateString("ja-JP");


        textContainer.append(
          text,
          date
        );


        const buttons = document.createElement("div");

        buttons.className = "task-buttons";


        // 戻すボタン

        const restoreButton = document.createElement("button");

        restoreButton.className = "restore-btn";

        restoreButton.textContent = "戻す";

        restoreButton.addEventListener("click", () => {

          restoreTask(task.id);

        });



        // 削除ボタン

        const deleteButton = document.createElement("button");

        deleteButton.className = "delete-btn";

        deleteButton.textContent = "削除";

        deleteButton.addEventListener("click", () => {

          deleteTask(task.id);

        });



        buttons.append(
          restoreButton,
          deleteButton
        );


        item.append(
          textContainer,
          buttons
        );


        archiveList.appendChild(item);

      });

    }



    // ===================================
    // ⑩ タスク表示用の関数
    // ===================================

    function createTaskElement(task, container, type) {

      const item = document.createElement("div");

      item.className = "task-item";


      // タスクの内容

      const text = document.createElement("div");

      text.className = "task-text";

      text.textContent = task.text;



      // ボタンの入れ物

      const buttons = document.createElement("div");

      buttons.className = "task-buttons";



      // 編集ボタン

      const editButton = document.createElement("button");

      editButton.className = "edit-btn";

      editButton.textContent = "編集";

      editButton.addEventListener("click", () => {

        editTask(task.id);

      });



      // 完了ボタン

      const archiveButton = document.createElement("button");

      archiveButton.className = "archive-btn";

      archiveButton.textContent = "完了";

      archiveButton.addEventListener("click", () => {

        archiveTask(task.id);

      });



      // タスク移動ボタン

      const moveButton = document.createElement("button");

      moveButton.className = "move-btn";


      if (type === "today") {

        moveButton.textContent = "今週中に移動";

        moveButton.addEventListener("click", () => {

          moveTask(task.id, "week");

        });

      } else {

        moveButton.textContent = "今日やる";

        moveButton.addEventListener("click", () => {

          moveTask(task.id, "today");

        });

      }



      // 削除ボタン

      const deleteButton = document.createElement("button");

      deleteButton.className = "delete-btn";

      deleteButton.textContent = "削除";

      deleteButton.addEventListener("click", () => {

        deleteTask(task.id);

      });



      // ボタンをまとめる

      buttons.append(
        editButton,
        archiveButton,
        moveButton,
        deleteButton
      );


      // タスクを表示

      item.append(
        text,
        buttons
      );


      container.appendChild(item);

    }



    // ===================================
    // ⑪ 今週の期間を表示
    // ===================================

    function showWeekRange() {

      const today = new Date();


      // 今週の月曜日を取得

      const monday = new Date(today);

      const day = today.getDay();

      const diff = day === 0 ? -6 : 1 - day;

      monday.setDate(today.getDate() + diff);


      // 今週の日曜日を取得

      const sunday = new Date(monday);

      sunday.setDate(monday.getDate() + 6);


      // 日付を整形

      const formatDate = date => {

        return date.toLocaleDateString("ja-JP", {

          month: "long",
          day: "numeric",
          weekday: "short"

        });

      };


      // 画面に表示

      document.getElementById("weekRange").textContent =
        formatDate(monday) +
        " 〜 " +
        formatDate(sunday);

    }



    // ===================================
    // ⑫ 登録ボタン・Enterキーの処理
    // ===================================

    document.getElementById("taskForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        addTask();

      });



    // ===================================
    // ⑬ 初期表示
    // ===================================

    renderTasks();

    showWeekRange();

    renderCharacter();


  </script>
