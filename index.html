  <style>

    /* ===================================
       全体
    =================================== */

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #f7f7fb;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    [hidden] { display: none !important; }

    .container {
      max-width: 700px;
      margin: 40px auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }


    /* ===================================
       カード
    =================================== */

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);

    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 20px;

    /* ===================================
       タスク入力
    =================================== */

      display: block;
      width: 100%;
      min-width: 0;

      border: 1px solid #ddd;

       タスクの種類

      flex: none;
      width: auto;
      margin: 0;
      accent-color: #a78bfa;
    }


    /* ===================================
       ボタン
    =================================== */

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    button:hover {

    }

    .add-btn {

      color: white;
      font-weight: bold;

    .edit-btn {

       タスク一覧

      align-items: center;

    .task-text {

      min-width: 0;

      font-size: 15px;
    }

    .task-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;

    /* ===================================
       アーカイブ
    =================================== */

    .archived-text {
      color: #999;
      text-decoration: line-through;
    }

=================================== */
.character-card {

}

/* ===================================

}

.exp-info {

=================================== */

/* ===================================

  <script>

    // =====================================
// ① Supabaseの設定
// =====================================

const SUPABASE_URL = "https://weftzcfogzqtskhklyft.supabase.co";

const SUPABASE_KEY = "sb_publishable_Ue3wX3hwEheWaZAdidm2Fw_cSy3EAj3";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// =====================================
// ② ログイン状態の確認
// =====================================

let currentUser = null;
let tasks = [];
let expData = { totalExp: 0, dailyRecords: {} };

async function checkLogin() {
  const { data, error } = await supabaseClient.auth.getUser();
  if (error || !data.user) {
    window.location.replace('./login.html');
    return;
  }
  currentUser = data.user;
  try {
    await loadTasks();
    document.getElementById('appContainer').hidden = false;
    showWeekRange();
  } catch (e) {
    console.error('タスク取得エラー:', e);
    alert('タスクの取得に失敗しました。tasksのカラムとRLSを確認してください。\n' + e.message);
  }
}
checkLogin();


// =====================================
// ③ ログアウト処理
// =====================================

const logoutButton =
  document.getElementById("logoutButton");

logoutButton.addEventListener("click", async function () {

  console.log("ログアウトボタンが押された！");

  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert("ログアウトに失敗しました：" + error.message);
    console.error(error);
    return;
  }

  window.location.replace("./login.html");

});

// Supabaseの行を画面表示用のタスクに変換
function fromRow(row) {
  return {
    id: row.id, text: row.title, taskType: row.task_type,
    archived: row.status === 'completed',
    createdAt: row.created_at, archivedAt: row.completed_at,
    points: row.points || 0
  };
}

async function loadTasks() {
  const { data, error } = await supabaseClient.from('tasks')
    .select('id,user_id,title,task_type,status,created_at,completed_at,points')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: true });
  if (error) throw error;
  tasks = data.map(fromRow);
  refreshExp();
  renderTasks();
  renderCharacter();
}

// 完了済みのタスク1件につき10EXP。同じ日の完了が5件以上なら10EXPを1回加算。
// DBのpointsに残る旧ルールの数値は集計に使わず、既存の完了記録も新ルールで換算する。
const TASK_EXP = 10;
const DAILY_BONUS_EXP = 10;
const DAILY_GOAL = 5;
const dateKey = value => new Date(value).toLocaleDateString('sv-SE');

function getExpBreakdown() {
  const completed = tasks.filter(task => task.archived && task.archivedAt);
  const counts = {};
  for (const task of completed) {
    const day = dateKey(task.archivedAt);
    counts[day] = (counts[day] || 0) + 1;
  }
  const bonusDays = Object.values(counts).filter(count => count >= DAILY_GOAL).length;
  return { total: completed.length * TASK_EXP + bonusDays * DAILY_BONUS_EXP, counts };
}

function refreshExp() {
  const { total, counts } = getExpBreakdown();
  expData.totalExp = total;
  const todayCount = counts[dateKey(new Date())] || 0;
  document.getElementById('dailyProgress').textContent =
    '今日の達成：' + todayCount + ' / 5 タスク' +
    (todayCount >= DAILY_GOAL ? ' 🎉 目標達成！' : '（あと' + (DAILY_GOAL - todayCount) + '件）');
}

// 通知は画面上に一時表示する（DBには保存しない）。
function showToast(message, levelUp = false) {
  const area = document.getElementById('toastArea');
  const toast = document.createElement('div');
  toast.className = levelUp ? 'toast level-up' : 'toast';
  toast.textContent = message;
  area.appendChild(toast);
  setTimeout(() => toast.remove(), 4500);
}

async function updateTaskRow(id, changes) {
  const { error } = await supabaseClient.from('tasks').update(changes)
    .eq('id', id).eq('user_id', currentUser.id);
  if (error) throw error;
  await loadTasks();
}

function showDbError(error) {
  console.error(error);
  alert('保存に失敗しました。Supabaseの設定を確認してください。\n' + error.message);
}



// ===================================
// レベルアップに必要な累計経験値
// ===================================

// 5タスク/日＝60EXPとして、初日Lv.2、7日Lv.5、30日Lv.15、
// 90日Lv.30、180日Lv.50に達する目安。節目の間は均等に配分する。
const levelMilestones = [
  [1, 0], [2, 20], [5, 420], [15, 1800], [30, 5400], [50, 10800]
];
const levelTable = Array.from({ length: 50 }, (_, index) => {
  const level = index + 1;
  const upperIndex = levelMilestones.findIndex(([milestone]) => milestone >= level);
  const [endLevel, endExp] = levelMilestones[upperIndex];
  if (level === endLevel) return endExp;
  const [startLevel, startExp] = levelMilestones[upperIndex - 1];
  const ratio = (level - startLevel) / (endLevel - startLevel);
  return Math.round((startExp + (endExp - startExp) * ratio) / 10) * 10;
});

    // ===================================
// 現在のレベルを計算
// ===================================

function calculateLevel(totalExp) {

  let level = 1;


  for (let i = 0; i < levelTable.length; i++) {

    if (totalExp >= levelTable[i]) {

      level = i + 1;

    } else {

      break;

    }

  }


  return level;

}

    // ===================================
// キャラクターの進化段階
// ===================================

function getCharacter(level) {

  if (level >= 50) {

    return {
      name: "伝説のドラゴン",
      icon: "🐲"
    };

  }


  if (level >= 43) {

    return {
      name: "ドラゴン",
      icon: "🐉"
    };

  }


  if (level >= 30) {

    return {
      name: "ドラゴンの幼体",
      icon: "🥚"
    };

  }


  if (level >= 15) {

    return {
      name: "スライムキング",
      icon: "👑"
    };

  }


  if (level >= 5) {

    return {
      name: "成長したスライム",
      icon: "💙"
    };

  }


  return {
    name: "スライム",
    icon: "💧"
  };

}

    // ===================================
// 経験値獲得
// ===================================

// 経験値はtasks.pointsの合計から計算するため、別途保存しない。


// ===================================
// 育成画面を更新
// ===================================

function renderCharacter() {

  const totalExp = expData.totalExp;


  // 現在のレベル

  const level = calculateLevel(totalExp);


  // キャラクターの情報

  const character = getCharacter(level);


  // キャラクター表示

  document.getElementById("characterIcon").textContent =
    character.icon;


  document.getElementById("characterName").textContent =
    character.name;


  document.getElementById("characterLevel").textContent =
    "Lv." + level;



  // ===================================
  // 経験値ゲージ
  // ===================================

  const currentLevelExp = levelTable[level - 1];


  // 最大レベルの場合

  if (level === 50) {

    document.getElementById("expText").textContent =
      "MAX LEVEL";


    document.getElementById("expFill").style.width =
      "100%";

  } else {

    // 次のレベルに必要な累計経験値

    const nextLevelExp = levelTable[level];


    // 現在のレベル内で獲得した経験値

    const currentExp = totalExp - currentLevelExp;


    // 次のレベルまでに必要な経験値

    const requiredExp = nextLevelExp - currentLevelExp;


    // 経験値ゲージの割合

    const expPercent =
      (currentExp / requiredExp) * 100;


    // 画面に反映

    document.getElementById("expText").textContent =
      currentExp + " / " + requiredExp;


    document.getElementById("expFill").style.width =
      expPercent + "%";

  }



  // 累計経験値

  document.getElementById("totalExp").textContent =
    "累計経験値：" + totalExp + " EXP";

}



// タスク登録・編集・削除・完了・復元・移動
async function addTask() {
  const input = document.getElementById('taskInput');
  const title = input.value.trim();
  if (!title || !currentUser) return;
  const taskType = document.querySelector('input[name="taskType"]:checked').value;
  try {
    const { error } = await supabaseClient.from('tasks').insert({
      user_id: currentUser.id, title, task_type: taskType,
      status: 'active', points: 0
    });
    if (error) throw error;
    input.value = '';
    await loadTasks();
    input.focus();
  } catch (e) { showDbError(e); }
}

async function editTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  const title = prompt('タスクを編集してください', task.text);
  if (title === null) return;
  if (!title.trim() || title.trim().length > 200) {
    alert('タスクは1〜200文字で入力してください'); return;
  }
  try { await updateTaskRow(id, { title: title.trim() }); }
  catch (e) { showDbError(e); }
}

async function deleteTask(id) {
  if (!confirm('このタスクを削除しますか？')) return;
  const task = tasks.find(t => t.id === id);
  const oldExp = expData.totalExp;
  const oldLevel = calculateLevel(oldExp);
  try {
    const { error } = await supabaseClient.from('tasks').delete()
      .eq('id', id).eq('user_id', currentUser.id);
    if (error) throw error;
    await loadTasks();
    if (task && task.archived) {
      showToast('🗑️ 完了済みタスクを削除 −' + (oldExp - expData.totalExp) + ' EXP');
      const newLevel = calculateLevel(expData.totalExp);
      if (newLevel < oldLevel) showToast('レベル変更：Lv.' + oldLevel + ' → Lv.' + newLevel);
    }
  } catch (e) { showDbError(e); }
}

async function archiveTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task || task.archived) return;
  const oldExp = expData.totalExp;
  const oldLevel = calculateLevel(oldExp);
  const beforeToday = getExpBreakdown().counts[dateKey(new Date())] || 0;
  try {
    await updateTaskRow(id, {
      status: 'completed', completed_at: new Date().toISOString(), points: TASK_EXP
    });
    const gained = expData.totalExp - oldExp;
    showToast('✅ タスク完了！ +' + gained + ' EXP');
    const afterToday = getExpBreakdown().counts[dateKey(new Date())] || 0;
    if (beforeToday < DAILY_GOAL && afterToday >= DAILY_GOAL) {
      showToast('🎯 今日の5タスク達成！ ボーナス +' + DAILY_BONUS_EXP + ' EXP');
    }
    const newLevel = calculateLevel(expData.totalExp);
    if (newLevel > oldLevel) showToast('🎉 LEVEL UP！ Lv.' + oldLevel + ' → Lv.' + newLevel, true);
  } catch (e) { showDbError(e); }
}

async function restoreTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task || !task.archived) return;
  const oldExp = expData.totalExp;
  const oldLevel = calculateLevel(oldExp);
  try {
    await updateTaskRow(id, {
      status: 'active', completed_at: null, points: 0
    });
    showToast('↩️ 完了を取り消しました −' + (oldExp - expData.totalExp) + ' EXP');
    const newLevel = calculateLevel(expData.totalExp);
    if (newLevel < oldLevel) showToast('レベル変更：Lv.' + oldLevel + ' → Lv.' + newLevel);
  } catch (e) { showDbError(e); }
}

async function moveTask(id, newType) {
  try { await updateTaskRow(id, { task_type: newType }); }
  catch (e) { showDbError(e); }
}



    // ===================================
    // ⑨ タスク一覧を表示
    // ===================================

    function renderTasks() {

      const taskList = document.getElementById("taskList");

      const weekTaskList = document.getElementById("weekTaskList");

      const archiveList = document.getElementById("archiveList");


      // 表示内容をリセット

      taskList.innerHTML = "";

      weekTaskList.innerHTML = "";

      archiveList.innerHTML = "";


      // ===================================
      // 今日やるタスク
      // ===================================

      const todayTasks = tasks.filter(task => {

        return !task.archived &&
          (task.taskType === "today" || !task.taskType);

      });



      // ===================================
      // 今週中にやるタスク
      // ===================================

      const weekTasks = tasks.filter(task => {

        return !task.archived &&
          task.taskType === "week";

      });



      // ===================================
      // 今日完了したタスク
      // ===================================

      const today = new Date().toLocaleDateString("sv-SE");


      const archivedTasks = tasks.filter(task => {

        if (!task.archived || !task.archivedAt) {
          return false;
        }


        const archivedDate = new Date(
          task.archivedAt
        ).toLocaleDateString("sv-SE");


        return archivedDate === today;

      });



      // ===================================
      // 今日やるタスクを表示
      // ===================================

      if (todayTasks.length === 0) {

        taskList.innerHTML = `
          <p class="empty-message">
            今日やるタスクはありません
          </p>
        `;

      }


      todayTasks.forEach(task => {

        createTaskElement(
          task,
          taskList,
          "today"
        );

      });



      // ===================================
      // 今週中にやるタスクを表示
      // ===================================

      if (weekTasks.length === 0) {

        weekTaskList.innerHTML = `
          <p class="empty-message">
            今週中にやるタスクはありません
          </p>
        `;

      }


      weekTasks.forEach(task => {

        createTaskElement(
          task,
          weekTaskList,
          "week"
        );

      });



      // ===================================
      // 今日完了したタスクを表示
      // ===================================

      if (archivedTasks.length === 0) {

        archiveList.innerHTML = `
          <p class="empty-message">
            今日完了したタスクはありません
          </p>
        `;

      }


      archivedTasks.forEach(task => {

        const item = document.createElement("div");

        item.className = "task-item";


        const textContainer = document.createElement("div");

        textContainer.className = "task-text";


        const text = document.createElement("div");

        text.className = "archived-text";

        text.textContent = task.text;


        const date = document.createElement("div");

        date.className = "archive-date";


        date.textContent =
          "完了日：" +
          new Date(task.archivedAt).toLocaleDateString("ja-JP");


        textContainer.append(
          text,
          date
        );


        const buttons = document.createElement("div");

        buttons.className = "task-buttons";


        // 戻すボタン

        const restoreButton = document.createElement("button");

        restoreButton.className = "restore-btn";

        restoreButton.textContent = "戻す";

        restoreButton.addEventListener("click", () => {

          restoreTask(task.id);

        });



        // 削除ボタン

        const deleteButton = document.createElement("button");

        deleteButton.className = "delete-btn";

        deleteButton.textContent = "削除";

        deleteButton.addEventListener("click", () => {

          deleteTask(task.id);

        });



        buttons.append(
          restoreButton,
          deleteButton
        );


        item.append(
          textContainer,
          buttons
        );


        archiveList.appendChild(item);

      });

    }



    // ===================================
    // ⑩ タスク表示用の関数
    // ===================================

    function createTaskElement(task, container, type) {

      const item = document.createElement("div");

      item.className = "task-item";


      // タスクの内容

      const text = document.createElement("div");

      text.className = "task-text";

      text.textContent = task.text;



      // ボタンの入れ物

      const buttons = document.createElement("div");

      buttons.className = "task-buttons";



      // 編集ボタン

      const editButton = document.createElement("button");

      editButton.className = "edit-btn";

      editButton.textContent = "編集";

      editButton.addEventListener("click", () => {

        editTask(task.id);

      });



      // 完了ボタン

      const archiveButton = document.createElement("button");

      archiveButton.className = "archive-btn";

      archiveButton.textContent = "完了";

      archiveButton.addEventListener("click", () => {

        archiveTask(task.id);

      });



      // タスク移動ボタン

      const moveButton = document.createElement("button");

      moveButton.className = "move-btn";


      if (type === "today") {

        moveButton.textContent = "今週中に移動";

        moveButton.addEventListener("click", () => {

          moveTask(task.id, "week");

        });

      } else {

        moveButton.textContent = "今日やる";

        moveButton.addEventListener("click", () => {

          moveTask(task.id, "today");

        });

      }



      // 削除ボタン

      const deleteButton = document.createElement("button");

      deleteButton.className = "delete-btn";

      deleteButton.textContent = "削除";

      deleteButton.addEventListener("click", () => {

        deleteTask(task.id);

      });



      // ボタンをまとめる

      buttons.append(
        editButton,
        archiveButton,
        moveButton,
        deleteButton
      );


      // タスクを表示

      item.append(
        text,
        buttons
      );


      container.appendChild(item);

    }



    // ===================================
    // ⑪ 今週の期間を表示
    // ===================================

    function showWeekRange() {

      const today = new Date();


      // 今週の月曜日を取得

      const monday = new Date(today);

      const day = today.getDay();

      const diff = day === 0 ? -6 : 1 - day;

      monday.setDate(today.getDate() + diff);


      // 今週の日曜日を取得

      const sunday = new Date(monday);

      sunday.setDate(monday.getDate() + 6);


      // 日付を整形

      const formatDate = date => {

        return date.toLocaleDateString("ja-JP", {

          month: "long",
          day: "numeric",
          weekday: "short"

        });

      };


      // 画面に表示

      document.getElementById("weekRange").textContent =
        formatDate(monday) +
        " 〜 " +
        formatDate(sunday);

    }
